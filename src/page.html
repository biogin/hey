<div id="app">
  <canvas id="gl" aria-label="Time machine viewport"></canvas>
  <div id="noGL" class="nogl" hidden data-i18n="nogl"></div>

  <div id="hud">
    <header id="cluster" class="glass">
      <div class="odo-row">
        <div id="odometer" class="odo" aria-live="off"></div>
        <span id="odoFrac" class="odo-frac mono">.0</span>
        <span id="odoEra" class="odo-era" data-i18n="era">CE</span>
      </div>
      <div class="mode-row">
        <span id="modeBadge" class="mode" data-mode="docked">DOCKED</span>
        <span id="dirArrow" class="dir">● rest</span>
        <span id="eta" class="eta mono"></span>
      </div>
      <dl class="readouts mono">
        <div><dt data-i18n="hud.vt">v<sub>t</sub></dt><dd><span id="rv">0.0</span><small data-i18n="hud.unit.yrs">yr/s</small></dd></div>
        <div><dt data-i18n="hud.gamma">γ</dt><dd><span id="rg">1.000</span></dd></div>
        <div><dt data-i18n="hud.doppler">Doppler</dt><dd><span id="rd">+0.00</span></dd></div>
        <div><dt data-i18n="hud.coherence">Coherence</dt><dd><span id="rc">100%</span></dd></div>
        <div><dt data-i18n="hud.strain">Strain</dt><dd><span id="re">0.0</span></dd></div>
      </dl>
    </header>

    <nav id="topRight" class="toolbar">
      <select id="langSel" class="btn ghost small lang" aria-label="Language"></select>
      <button id="soundBtn" class="btn ghost small" aria-pressed="false" data-i18n="btn.soundOff">Sound off</button>
      <button id="theoryBtn" class="btn ghost small" data-i18n="btn.theory">Theory</button>
      <button id="helpBtn" class="btn ghost small" data-i18n="btn.help">Help</button>
      <button id="fullBtn" class="btn ghost small" data-i18n-title="btn.fullscreen" title="Fullscreen">⤢</button>
    </nav>

    <aside id="dock" class="glass hidden">
      <button id="dockHandle" class="dock-handle" data-i18n-aria="dock.handle" aria-label="Collapse or expand the dossier"><span></span></button>
      <div id="dockBody" class="dock-body"></div>
    </aside>

    <div id="flashWrap" class="flash-wrap" aria-live="polite"><div id="flash" class="flash display"></div><div id="flashSub" class="flash-sub mono"></div></div>
    <div id="toast" class="toast" hidden></div>

    <footer id="console" class="glass">
      <div id="timeline" class="timeline">
        <div id="tlTicks" class="tl-ticks"></div>
        <div id="tlTrack" class="tl-track">
          <div id="tlMarkers" class="tl-markers"></div>
          <div id="tlNeedle" class="tl-needle"></div>
          <div id="tlLabel" class="tl-label mono" hidden></div>
        </div>
      </div>
      <div class="controls">
        <button id="prevEpoch" class="btn ghost small" data-i18n-title="btn.prev.title" title="Previous epoch ([)">◀</button>
        <div id="throttle" class="throttle" data-i18n-title="th.title" title="Drag: thrust toward the past (left) or the future (right). Springs back to zero.">
          <span class="th-label past" data-i18n="th.past">past</span>
          <div class="th-track"><div class="th-fill"></div><div id="throttleKnob" class="th-knob"></div></div>
          <span class="th-label fut" data-i18n="th.future">future</span>
        </div>
        <button id="nextEpoch" class="btn ghost small" data-i18n-title="btn.next.title" title="Next epoch (])">▶</button>
        <button id="brakeBtn" class="btn small" data-i18n="btn.brake" data-i18n-title="btn.brake.title" title="Brake (space)">Brake</button>
        <button id="dockBtn" class="btn small" data-i18n="btn.dock" data-i18n-title="btn.dock.title" title="Autopilot to the nearest epoch (enter)">Dock</button>
        <button id="stopBtn" class="btn ghost small" hidden data-i18n="btn.cancel" data-i18n-title="btn.cancel.title" title="Cancel autopilot (esc)">Cancel</button>
      </div>
    </footer>
  </div>

  <div id="intro" class="overlay intro">
    <div class="intro-card">
      <div class="intro-lang"><select id="langSelIntro" class="btn ghost small lang" aria-label="Language"></select></div>
      <p class="eyebrow" data-i18n="intro.eyebrow">A time machine through music epochs</p>
      <h1 class="display" data-i18n="app.title">Kairos Engine</h1>
      <p class="intro-lede serif" data-i18n="intro.lede"></p>
      <p class="intro-body" data-i18n="intro.body"></p>
      <div class="intro-actions">
        <button id="engage" class="btn primary" data-i18n="intro.engage">Engage drive, with sound</button>
        <button id="engageQuiet" class="btn ghost" data-i18n="intro.engageQuiet">Engage silently</button>
      </div>
      <p class="intro-keys mono" data-i18n="intro.keys"></p>
    </div>
  </div>

  <div id="theory" class="overlay modal" hidden>
    <div class="modal-card glass"><button class="close" data-close aria-label="Close">×</button><div id="theoryBody" class="modal-body"></div></div>
  </div>

  <div id="help" class="overlay modal" hidden>
    <div class="modal-card glass small"><button class="close" data-close aria-label="Close">×</button>
      <div class="modal-body">
        <p class="eyebrow" data-i18n="help.eyebrow">Controls</p>
        <h2 class="display" data-i18n="help.title">Flying the drive</h2>
        <ul class="keys">
          <li data-i18n="help.1"></li>
          <li data-i18n="help.2"></li>
          <li data-i18n="help.3"></li>
          <li data-i18n="help.4"></li>
          <li data-i18n="help.5"></li>
          <li data-i18n="help.6"></li>
        </ul>
        <p class="fine" data-i18n="help.fine"></p>
      </div>
    </div>
  </div>
</div>
