name: Deploy Kairos Engine to GitHub Pages

on:
  push:
    branches: [main, master, claude/friendly-mendel-9yalvp]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: touch dist/.nojekyll
      # Publishes dist/ to the gh-pages branch. GitHub serves it at https://biogin.github.io/hey/
      # once Pages is enabled for the repository (Settings → Pages → Branch: gh-pages).
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
