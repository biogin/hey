screen":"Fullscreen","btn.language":"Language","tl.now":"now","tl.marker":"{name} ({a}–{b})","th.past":"past","th.future":"future","th.title":"Drag: thrust toward the past (left) or the future (right). Springs back to zero.","btn.brake":"Brake","btn.brake.title":"Brake (space)","btn.dock":"Dock","btn.dock.title":"Autopilot to the nearest epoch (enter)","btn.cancel":"Cancel","btn.cancel.title":"Cancel autopilot (esc)","btn.prev.title":"Previous epoch ([)","btn.next.title":"Next epoch (])","dock.handle":"Collapse or expand the dossier","flash.sub":"{a}–{b} · passing at {v} yr/s","toast.lock.full":"Kairos lock: skill, environment and need aligned.","toast.lock.partial":"Partial alignment: one term is missing.","toast.lock.none":"No lock: the need was not there.","toast.boundary.past":"Temporal boundary. The archive begins at {year}; the drive recoiled.","toast.boundary.future":"Forecast horizon. Beyond {year} the model has nothing; the drive recoiled.","panel.epoch":"Epoch · {a}–{b}","panel.need":"What the culture needed","panel.env":"What the environment made possible","panel.cases":"Kairos cases","panel.cases.hint":"select one to align the orrery","panel.pendulum":"The need pendulum","panel.pendulum.fine":"Where this epoch's cultural need sat on five bipolar axes, against the epoch before it. Editorial scores, used by the forecast model.","fit.skill":"Skill","fit.env":"Environment","fit.need":"Need","status.locked":"Kairos lock","status.deferred":"Lock deferred","status.partial":"Partial lock","case.skill":"Skill","case.env":"Environment","case.need":"What the culture needed","legend.previous":"previous","void.eyebrow":"Interstice · {y}","void.title":"Between epochs","void.lede":"The drive finds no stable resonance at {y}. Music was happening, people were brilliant, but no documented Kairos lock in this archive sits here.","void.tip":"Tip: thrust is bounded at {amax} yr/s² and top speed at {vmax} yr/s. The autopilot plans a brake point; manual flight needs you to brake before the target or you will overshoot.","fc.eyebrow":"Forecast · +{n} {years} · {year}","fc.year":"year","fc.years":"years","fc.confidence":"Confidence","fc.need":"What the culture will need","fc.env":"The environment","fc.skills":"Skills that will be rewarded","fc.who":"Who locks","fc.model":"The pendulum model says","fc.model.legend":"model, {year}","fc.dir.center":"<b>{neg} ↔ {pos}</b>: near the center, moving toward {toward}.","fc.dir.strong":"<b>{neg} ↔ {pos}</b>: strongly toward {pole}, moving toward {toward}.","fc.dir.moderate":"<b>{neg} ↔ {pos}</b>: moderately toward {pole}, moving toward {toward}.","fc.fine":"This is a toy: a sinusoid fitted to the {n} hand-scored epochs since {from}, with the period searched between 20 and 50 years, extrapolated with a widening error cone. The written forecast above is an analyst's reading that uses the model as one input. Where they disagree, trust neither very much. Past {year} the cone covers the whole axis, which is the model admitting it does not know.","chart.band":"model ± 1σ","chart.now":"now","chart.caption":"Fitted period {p} years, amplitude {a}, residual σ {s}. Next turning point around {y}. Points are the epochs since {from}; the shaded cone is ±1σ widening with distance.","chart.aria.pendulum":"Cultural need on five bipolar axes","chart.aria.forecast":"{neg} to {pos} over time with forecast band","chart.previous":"previous","axis.sincerity.neg":"Artifice","axis.sincerity.pos":"Sincerity","axis.communal.neg":"Individual","axis.communal.pos":"Communal","axis.body.neg":"Mind","axis.body.pos":"Body","axis.local.neg":"Global","axis.local.pos":"Local","axis.rough.neg":"Polished","axis.rough.pos":"Rough","outcome.0":"Kairos lock","outcome.0.ex":"The Beatles, 1964","outcome.1":"Ahead of their time, or they move","outcome.1.ex":"Hendrix before London, 1966","outcome.2":"Respected craftsman, forgotten","outcome.2.ex":"Bach, 1740s","outcome.3":"One hit, or a cover version wins","outcome.3.ex":"The novelty single","outcome.4":"Local legend","outcome.4.ex":"Every great bar band","outcome.5":"Industry plant that does not take","outcome.5.ex":"Most major-label debuts","outcome.6":"The need waits for someone else","outcome.6.ex":"Punk before 1976","help.eyebrow":"Controls","help.title":"Flying the drive","help.1":"<kbd>←</kbd> <kbd>→</kbd> or drag the throttle: thrust toward the past or the future. Release and you coast.","help.2":"<kbd>space</kbd> or <b>Brake</b>: thrust against your motion until you stop.","help.3":"<kbd>enter</kbd> or <b>Dock</b>: autopilot to the nearest epoch.","help.4":"<kbd>[</kbd> <kbd>]</kbd>: autopilot to the previous or next epoch. Clicking the timeline does the same for any year.","help.5":"Mouse wheel over the view: a velocity impulse. Drag the view to look around.","help.6":"<kbd>m</kbd> sound · <kbd>t</kbd> theory · <kbd>esc</kbd> cancel autopilot or close a panel.","help.fine":"Inside an epoch, select a Kairos case to align the orrery. Beyond 2026 the worlds flicker: that is the forecast uncertainty, rendered.","theory.eyebrow":"Theory","theory.title":"Chronos and Kairos","theory.p1":"The Greeks had two words for time. <b>Chronos</b> is the time you travel through: sequential, measurable, the kind this drive pushes against. <b>Kairos</b> is the opportune moment: the instant when the thing you can do is the thing the world is ready for. This machine moves through Chronos to find Kairos.","theory.h.lock":"The lock condition","theory.p2":'Every artist in this archive who "made it" did so when three independent quantities crossed their thresholds at the same time:',"theory.li.skill":'<b class="k-skill">Skill</b>: the specific capability the moment calls for. Not a conservatory grade. For the Sex Pistols it was attitude; for Caruso it was a voice shaped for a horn.',"theory.li.env":'<b class="k-env">Environment</b>: the technology, the business, the city, the gatekeepers, and who the system is willing to let through. Microphones, race records, MTV, SoundScan, Spotify, TikTok.',"theory.li.need":'<b class="k-need">Cultural need</b>: what a population was hungry for right then. Joy eleven weeks after Dallas. Sincerity after a decade of gloss. A whisper in an earbud.',"theory.p3":"The lock is a <em>conjunction</em>, not a sum. Two out of three does not give you two thirds of a career. The outcome table shows what each missing term produces.","theory.th.skill":"Skill","theory.th.env":"Env","theory.th.need":"Need","theory.th.outcome":"Outcome","theory.th.example":"Example","theory.h.window":"Why the window is short","theory.p4":"The three terms move on different clocks. Skill accumulates slowly over years. Environment changes in steps when a technology or a gate opens. Need swings like a pendulum with a period of roughly a generation, because each cohort wants the opposite of what its older siblings had. The orrery in the scene shows this: a slow ring, a stepping ring, an oscillating ring. They align briefly.","theory.h.model":"The pendulum model","theory.p5":"Each epoch is scored on five bipolar axes. A sinusoid is fitted per axis to the epochs since {from} (the recorded-music era, dense enough to resolve a cycle), with the period searched between 20 and 50 years, then extrapolated with an error cone. Fitted parameters:","theory.th.axis":"Axis","theory.th.period":"Period","theory.th.amp":"Amplitude","theory.th.turn":"Next turn","theory.yr":"yr","theory.h.missing":"What this leaves out","theory.li.surv":"Survivorship: the archive only contains locks that happened. For every entry there were thousands with two out of three.","theory.li.hind":'Hindsight: "the culture needed it" is easy to say afterwards. The forecast tabs are the honest test of whether the idea predicts anything.',"theory.li.luck":"Luck, properly defined, is the two terms you do not control. Skill is the one you do. The strategy that follows is unglamorous: build the skill, move toward the environment, and still be there when the need swings around.","theory.h.drive":"How the drive works","theory.p6":"The ship has a position in time, a temporal velocity (years of history per second of your time) and a bounded acceleration of {amax} yr/s², with a drag that rises with speed toward an asymptote of {vmax} yr/s. You cannot stop instantly. The autopilot plans a bang-bang trajectory with a damped final approach. The instruments are dressed as relativistic readouts: <b>γ</b> is the dilation factor at your fraction of top speed, <b>Doppler</b> is signed by direction (blue toward the future, red toward the past) and shifts both the tunnel colour and the engine pitch, <b>coherence</b> falls with acceleration and speed, and <b>strain</b> integrates how violently you have been pushing through time."};var Wu={"lang.name":"Русский","app.title":"Kairos Engine",era:"н. э.","intro.eyebrow":"Машина времени по музыкальным эпохам","intro.lede":"Хронос — это время, сквозь которое летишь. Кайрос — момент, в который прибываешь: когда умение человека, его среда и то, чего требовала культура, сходятся в одной точке. Один раз.","intro.body":"Пролетите от барочных дворов до эпохи алгоритмов и дальше, в четыре горизонта прогноза. На каждой остановке планетарий показывает три силы, которые должны были совпасть, а досье называет тех, кто оказался в луче.","intro.engage":"Запустить двигатель со звуком","intro.engageQuiet":"Запустить без звука","intro.keys":"тяните мышью, чтобы осмотреться · ← → тяга · пробел тормоз · enter стыковка · [ ] эпохи · колесо — импульс",nogl:"Браузер не смог запустить WebGL. Досье работает, трёхмерный вид — нет.","hud.vt":"v<sub>t</sub>","hud.gamma":"γ","hud.doppler":"Доплер","hud.coherence":"Связность","hud.strain":"Нагрузка","hud.unit.yrs":"лет/с","mode.docked":"СТЫКОВКА","mode.autopilot":"АВТОПИЛОТ","mode.manual":"РУЧНОЙ","mode.braking":"ТОРМОЖЕНИЕ","mode.adrift":"ДРЕЙФ","dir.future":"▶ в будущее","dir.past":"◀ в прошлое","dir.rest":"● покой","hud.eta":"→ {year} · прибытие через {s} с","btn.soundOn":"Звук вкл","btn.soundOff":"Звук выкл","btn.theory":"Теория","btn.help":"Помощь","btn.fullscreen":"Во весь экран","btn.language":"Язык","tl.now":"сейчас","tl.marker":"{name} ({a}–{b})","th.past":"прошлое","th.future":"будущее","th.title":"Тяните: тяга в прошлое (влево) или в будущее (вправо). Рычаг возвращается в ноль.","btn.brake":"Тормоз","btn.brake.title":"Тормоз (пробел)","btn.dock":"Стыковка","btn.dock.title":"Автопилот к ближайшей эпохе (enter)","btn.cancel":"Отмена","btn.cancel.title":"Отменить автопилот (esc)","btn.prev.title":"Предыдущая эпоха ([)","btn.next.title":"Следующая эпоха (])","dock.handle":"Свернуть или развернуть досье","flash.sub":"{a}–{b} · пролёт на скорости {v} лет/с","toast.lock.full":"Захват Кайроса: умение, среда и запрос совпали.","toast.lock.partial":"Частичное совпадение: одного слагаемого не хватает.","toast.lock.none":"Захвата нет: запроса ещё не было.","toast.boundary.past":"Граница времени. Архив начинается с {year} года; двигатель отбросило назад.","toast.boundary.future":"Горизонт прогноза. Дальше {year} года у модели ничего нет; двигатель отбросило назад.","panel.epoch":"Эпоха · {a}–{b}","panel.need":"Чего требовала культура","panel.env":"Что сделала возможным среда","panel.cases":"Случаи Кайроса","panel.cases.hint":"выберите один, чтобы выровнять планетарий","panel.pendulum":"Маятник запроса","panel.pendulum.fine":"Где культурный запрос этой эпохи находился на пяти биполярных осях — в сравнении с предыдущей эпохой. Редакторские оценки, на которых работает модель прогноза.","fit.skill":"Умение","fit.env":"Среда","fit.need":"Запрос","status.locked":"Захват Кайроса","status.deferred":"Захват отложен","status.partial":"Частичный захват","case.skill":"Умение","case.env":"Среда","case.need":"Чего требовала культура","legend.previous":"предыдущая","void.eyebrow":"Промежуток · {y}","void.title":"Между эпохами","void.lede":"В {y} году двигатель не находит устойчивого резонанса. Музыка звучала, люди были блестящими, но задокументированного захвата Кайроса в этом архиве здесь нет.","void.tip":"Подсказка: тяга ограничена {amax} лет/с², предельная скорость — {vmax} лет/с. Автопилот сам рассчитывает точку торможения; в ручном режиме тормозить нужно заранее, иначе проскочите цель.","fc.eyebrow":"Прогноз · +{n} {years} · {year}","fc.year":"год","fc.years":"лет","fc.confidence":"Уверенность","fc.need":"Чего потребует культура","fc.env":"Среда","fc.skills":"Какие умения будут вознаграждены","fc.who":"У кого случится захват","fc.model":"Что говорит модель маятника","fc.model.legend":"модель, {year}","fc.dir.center":"<b>{neg} ↔ {pos}</b>: около центра, движется к полюсу «{toward}».","fc.dir.strong":"<b>{neg} ↔ {pos}</b>: сильный сдвиг к полюсу «{pole}», движется к полюсу «{toward}».","fc.dir.moderate":"<b>{neg} ↔ {pos}</b>: умеренный сдвиг к полюсу «{pole}», движется к полюсу «{toward}».","fc.fine":"Это игрушка: синусоида, подогнанная к {n} эпохам с {from} года, оценённым вручную, с периодом в диапазоне от 20 до 50 лет и расширяющимся конусом ошибки. Текстовый прогноз выше — чтение аналитика, для которого модель лишь один из источников. Там, где они расходятся, не стоит слишком доверять ни тому, ни другому. После {year} года конус накрывает всю ось: так модель признаётся, что не знает.","chart.band":"модель ± 1σ","chart.now":"сейчас","chart.caption":"Подобранный период {p} лет, амплитуда {a}, остаточное σ {s}. Следующая точка разворота около {y} года. Точки — эпохи с {from} года; заштрихованный конус — ±1σ, расширяющийся с расстоянием.","chart.aria.pendulum":"Культурный запрос на пяти биполярных осях","chart.aria.forecast":"От «{neg}» к «{pos}» во времени с полосой прогноза","chart.previous":"предыдущая","axis.sincerity.neg":"Искусственное","axis.sincerity.pos":"Искреннее","axis.communal.neg":"Личное","axis.communal.pos":"Общее","axis.body.neg":"Разум","axis.body.pos":"Тело","axis.local.neg":"Глобальное","axis.local.pos":"Локальное","axis.rough.neg":"Гладкое","axis.rough.pos":"Сырое","outcome.0":"Захват Кайроса","outcome.0.ex":"The Beatles, 1964","outcome.1":"Опередили время — или переехали","outcome.1.ex":"Хендрикс до Лондона, 1966","outcome.2":"Уважаемый мастер, забытый","outcome.2.ex":"Бах, 1740-е","outcome.3":"Один хит — или побеждает кавер","outcome.3.ex":"Сингл-однодневка","outcome.4":"Местная легенда","outcome.4.ex":"Любая великая клубная группа","outcome.5":"Проект лейбла, который не взлетел","outcome.5.ex":"Большинство дебютов на мейджорах","outcome.6":"Запрос ждёт кого-то другого","outcome.6.ex":"Панк до 1976 года","help.eyebrow":"Управление","help.title":"Как летать","help.1":"<kbd>←</kbd> <kbd>→</kbd> или тяните рычаг тяги: ускорение в прошлое или в будущее. Отпустите — и корабль идёт по инерции.","help.2":"<kbd>пробел</kbd> или <b>Тормоз</b>: тяга против движения до полной остановки.","help.3":"<kbd>enter</kbd> или <b>Стыковка</b>: автопилот к ближайшей эпохе.","help.4":"<kbd>[</kbd> <kbd>]</kbd>: автопилот к предыдущей или следующей эпохе. Клик по шкале времени делает то же для любого года.","help.5":"Колесо мыши над видом — импульс скорости. Тяните вид, чтобы осмотреться.","help.6":"<kbd>m</kbd> звук · <kbd>t</kbd> теория · <kbd>esc</kbd> отменить автопилот или закрыть панель.","help.fine":"Внутри эпохи выберите случай Кайроса, чтобы выровнять планетарий. После 2026 года миры мерцают: это неопределённость прогноза, отрисованная буквально.","theory.eyebrow":"Теория","theory.title":"Хронос и Кайрос","theory.p1":"У греков было два слова для времени. <b>Хронос</b> — время, сквозь которое летишь: последовательное, измеримое, то самое, от которого отталкивается этот двигатель. <b>Кайрос</b> — удобный момент: миг, когда то, что ты умеешь, оказывается тем, к чему готов мир. Эта машина движется сквозь Хронос, чтобы найти Кайрос.","theory.h.lock":"Условие захвата","theory.p2":"Каждый артист из этого архива, который «пробился», сделал это, когда три независимые величины одновременно перешли свои пороги:","theory.li.skill":'<b class="k-skill">Умение</b>: конкретная способность, которой требует момент. Не оценка в консерватории. Для Sex Pistols это была дерзость; для Карузо — голос, словно созданный для рупора.',"theory.li.env":'<b class="k-env">Среда</b>: технологии, индустрия, город, привратники и то, кого система готова пропустить. Микрофоны, race records, MTV, SoundScan, Spotify, TikTok.',"theory.li.need":'<b class="k-need">Культурный запрос</b>: чего людям не хватало именно тогда. Радости через одиннадцать недель после Далласа. Искренности после десятилетия глянца. Шёпота в наушнике.',"theory.p3":"Захват — это <em>конъюнкция</em>, а не сумма. Два из трёх не дают двух третей карьеры. Таблица исходов показывает, что получается при каждом недостающем слагаемом.","theory.th.skill":"Умение","theory.th.env":"Среда","theory.th.need":"Запрос","theory.th.outcome":"Исход","theory.th.example":"Пример","theory.h.window":"Почему окно такое короткое","theory.p4":"Три слагаемых идут по разным часам. Умение накапливается медленно, годами. Среда меняется скачками, когда открывается технология или ворота. Запрос качается как маятник с периодом примерно в поколение, потому что каждая когорта хочет противоположного тому, что было у старших. Планетарий в сцене показывает это: медленное кольцо, кольцо со скачками и колеблющееся кольцо. Они совпадают ненадолго.","theory.h.model":"Модель маятника","theory.p5":"Каждая эпоха оценена по пяти биполярным осям. К эпохам с {from} года (эра звукозаписи, достаточно плотная, чтобы различить цикл) по каждой оси подогнана синусоида с периодом от 20 до 50 лет, а затем экстраполирована с конусом ошибки. Подобранные параметры:","theory.th.axis":"Ось","theory.th.period":"Период","theory.th.amp":"Амплитуда","theory.th.turn":"Разворот","theory.yr":"лет","theory.h.missing":"Что здесь не учтено","theory.li.surv":"Ошибка выжившего: в архиве только те захваты, которые случились. На каждую запись приходятся тысячи тех, у кого было два из трёх.","theory.li.hind":"Задний ум: сказать «культуре это было нужно» легко постфактум. Вкладки прогноза — честная проверка того, предсказывает ли идея хоть что-нибудь.","theory.li.luck":"Удача, если определить её строго, — это два слагаемых, которые вы не контролируете. Умение — то, которое контролируете. Стратегия отсюда следует негламурная: наращивать умение, двигаться к среде и всё ещё быть на месте, когда запрос качнётся в вашу сторону.","theory.h.drive":"Как работает двигатель","theory.p6":"У корабля есть положение во времени, темпоральная скорость (лет истории за секунду вашего времени) и ограниченное ускорение {amax} лет/с², а сопротивление растёт со скоростью, упираясь в асимптоту {vmax} лет/с. Остановиться мгновенно нельзя. Автопилот строит траекторию «газ—тормоз» с демпфированным финальным подходом. Приборы стилизованы под релятивистские: <b>γ</b> — коэффициент замедления при вашей доле от предельной скорости; <b>Доплер</b> имеет знак направления (синий — в будущее, красный — в прошлое) и сдвигает и цвет туннеля, и тон двигателя; <b>связность</b> падает с ускорением и скоростью; <b>нагрузка</b> накапливает, насколько резко вы продирались сквозь время."};var Xu={"lang.name":"Español","app.title":"Kairos Engine",era:"d. C.","intro.eyebrow":"Una máquina del tiempo por las épocas de la música","intro.lede":"Chronos es el tiempo que atraviesas. Kairós es el momento al que llegas: cuando la destreza de alguien, su entorno y lo que la cultura necesitaba convergen en una sola persona, una sola vez.","intro.body":"Vuela desde las cortes barrocas hasta la era del algoritmo y sigue hacia cuatro horizontes de pronóstico. En cada parada, el planetario muestra las tres fuerzas que tuvieron que alinearse, y el dossier nombra a quien quedó en el haz de luz.","intro.engage":"Encender el motor, con sonido","intro.engageQuiet":"Encender en silencio","intro.keys":"arrastra para mirar · ← → empuje · espacio freno · enter acoplar · [ ] saltar épocas · rueda para impulso",nogl:"Este navegador no pudo iniciar WebGL. El dossier funciona; la vista 3D no.","hud.vt":"v<sub>t</sub>","hud.gamma":"γ","hud.doppler":"Doppler","hud.coherence":"Coherencia","hud.strain":"Esfuerzo","hud.unit.yrs":"años/s","mode.docked":"ACOPLADO","mode.autopilot":"PILOTO AUTO","mode.manual":"MANUAL","mode.braking":"FRENANDO","mode.adrift":"A LA DERIVA","dir.future":"▶ futuro","dir.past":"◀ pasado","dir.rest":"● reposo","hud.eta":"→ {year} · llegada en {s} s","btn.soundOn":"Sonido activado","btn.soundOff":"Sonido apagado","btn.theory":"Teoría","btn.help":"Ayuda","btn.fullscreen":"Pantalla completa","btn.language":"Idioma","tl.now":"ahora","tl.marker":"{name} ({a}–{b})","th.past":"pasado","th.future":"futuro","th.title":"Arrastra: empuje hacia el pasado (izquierda) o el futuro (derecha). Vuelve a cero al soltar.","btn.brake":"Frenar","btn.brake.title":"Frenar (espacio)","btn.dock":"Acoplar","btn.dock.title":"Piloto automático a la época más cercana (enter)","btn.cancel":"Cancelar","btn.cancel.title":"Cancelar el piloto automático (esc)","btn.prev.title":"Época anterior ([)","btn.next.title":"Época siguiente (])","dock.handle":"Plegar o desplegar el dossier","flash.sub":"{a}–{b} · pasando a {v} años/s","toast.lock.full":"Bloqueo de Kairós: destreza, entorno y necesidad alineados.","toast.lock.partial":"Alineación parcial: falta un término.","toast.lock.none":"Sin bloqueo: la necesidad no estaba ahí.","toast.boundary.past":"Frontera temporal. El archivo empieza en {year}; el motor retrocedió.","toast.boundary.future":"Horizonte de pronóstico. Más allá de {year} el modelo no tiene nada; el motor retrocedió.","panel.epoch":"Época · {a}–{b}","panel.need":"Lo que la cultura necesitaba","panel.env":"Lo que el entorno hizo posible","panel.cases":"Casos de Kairós","panel.cases.hint":"elige uno para alinear el planetario","panel.pendulum":"El péndulo de la necesidad","panel.pendulum.fine":"Dónde se situaba la necesidad cultural de esta época en cinco ejes bipolares, frente a la época anterior. Puntuaciones editoriales, usadas por el modelo de pronóstico.","fit.skill":"Destreza","fit.env":"Entorno","fit.need":"Necesidad","status.locked":"Bloqueo de Kairós","status.deferred":"Bloqueo diferido","status.partial":"Bloqueo parcial","case.skill":"Destreza","case.env":"Entorno","case.need":"Lo que la cultura necesitaba","legend.previous":"anterior","void.eyebrow":"Intersticio · {y}","void.title":"Entre épocas","void.lede":"El motor no encuentra resonancia estable en {y}. Había música, había gente brillante, pero ningún bloqueo de Kairós documentado en este archivo cae aquí.","void.tip":"Consejo: el empuje está limitado a {amax} años/s² y la velocidad máxima a {vmax} años/s. El piloto automático planifica el punto de frenado; en vuelo manual debes frenar antes del objetivo o te pasarás.","fc.eyebrow":"Pronóstico · +{n} {years} · {year}","fc.year":"año","fc.years":"años","fc.confidence":"Confianza","fc.need":"Lo que la cultura necesitará","fc.env":"El entorno","fc.skills":"Destrezas que serán recompensadas","fc.who":"Quién logra el bloqueo","fc.model":"Lo que dice el modelo del péndulo","fc.model.legend":"modelo, {year}","fc.dir.center":"<b>{neg} ↔ {pos}</b>: cerca del centro, moviéndose hacia {toward}.","fc.dir.strong":"<b>{neg} ↔ {pos}</b>: claramente hacia {pole}, moviéndose hacia {toward}.","fc.dir.moderate":"<b>{neg} ↔ {pos}</b>: moderadamente hacia {pole}, moviéndose hacia {toward}.","fc.fine":"Esto es un juguete: una sinusoide ajustada a las {n} épocas puntuadas a mano desde {from}, con el periodo buscado entre 20 y 50 años, extrapolada con un cono de error que se ensancha. El pronóstico escrito arriba es la lectura de un analista que usa el modelo como una entrada más. Donde discrepan, no confíes mucho en ninguno. Pasado {year} el cono cubre todo el eje: es el modelo admitiendo que no sabe.","chart.band":"modelo ± 1σ","chart.now":"ahora","chart.caption":"Periodo ajustado {p} años, amplitud {a}, σ residual {s}. Próximo punto de giro hacia {y}. Los puntos son las épocas desde {from}; el cono sombreado es ±1σ y se ensancha con la distancia.","chart.aria.pendulum":"Necesidad cultural en cinco ejes bipolares","chart.aria.forecast":"De {neg} a {pos} en el tiempo con banda de pronóstico","chart.previous":"anterior","axis.sincerity.neg":"Artificio","axis.sincerity.pos":"Sinceridad","axis.communal.neg":"Individual","axis.communal.pos":"Comunitario","axis.body.neg":"Mente","axis.body.pos":"Cuerpo","axis.local.neg":"Global","axis.local.pos":"Local","axis.rough.neg":"Pulido","axis.rough.pos":"Crudo","outcome.0":"Bloqueo de Kairós","outcome.0.ex":"The Beatles, 1964","outcome.1":"Adelantados a su tiempo, o se mudan","outcome.1.ex":"Hendrix antes de Londres, 1966","outcome.2":"Artesano respetado, olvidado","outcome.2.ex":"Bach, década de 1740","outcome.3":"Un éxito, o gana la versión","outcome.3.ex":"El sencillo de moda","outcome.4":"Leyenda local","outcome.4.ex":"Toda gran banda de bar","outcome.5":"Producto de discográfica que no prende","outcome.5.ex":"La mayoría de debuts en multinacionales","outcome.6":"La necesidad espera a otro","outcome.6.ex":"El punk antes de 1976","help.eyebrow":"Controles","help.title":"Cómo volar el motor","help.1":"<kbd>←</kbd> <kbd>→</kbd> o arrastra la palanca: empuje hacia el pasado o el futuro. Suelta y sigues por inercia.","help.2":"<kbd>espacio</kbd> o <b>Frenar</b>: empuje contra tu movimiento hasta detenerte.","help.3":"<kbd>enter</kbd> o <b>Acoplar</b>: piloto automático a la época más cercana.","help.4":"<kbd>[</kbd> <kbd>]</kbd>: piloto automático a la época anterior o siguiente. Hacer clic en la línea de tiempo hace lo mismo para cualquier año.","help.5":"Rueda del ratón sobre la vista: un impulso de velocidad. Arrastra la vista para mirar alrededor.","help.6":"<kbd>m</kbd> sonido · <kbd>t</kbd> teoría · <kbd>esc</kbd> cancelar el piloto automático o cerrar un panel.","help.fine":"Dentro de una época, elige un caso de Kairós para alinear el planetario. Más allá de 2026 los mundos parpadean: es la incertidumbre del pronóstico, hecha visible.","theory.eyebrow":"Teoría","theory.title":"Chronos y Kairós","theory.p1":"Los griegos tenían dos palabras para el tiempo. <b>Chronos</b> es el tiempo que atraviesas: secuencial, medible, el que este motor empuja. <b>Kairós</b> es el momento oportuno: el instante en que lo que sabes hacer es lo que el mundo está listo para recibir. Esta máquina se mueve por Chronos para encontrar Kairós.","theory.h.lock":"La condición de bloqueo","theory.p2":"Cada artista de este archivo que «lo logró» lo hizo cuando tres cantidades independientes cruzaron sus umbrales al mismo tiempo:","theory.li.skill":'<b class="k-skill">Destreza</b>: la capacidad concreta que pide el momento. No una nota de conservatorio. Para los Sex Pistols fue la actitud; para Caruso, una voz hecha para la bocina.',"theory.li.env":'<b class="k-env">Entorno</b>: la tecnología, el negocio, la ciudad, los guardianes de la puerta y a quién está dispuesto a dejar pasar el sistema. Micrófonos, race records, MTV, SoundScan, Spotify, TikTok.',"theory.li.need":'<b class="k-need">Necesidad cultural</b>: de qué tenía hambre una población justo entonces. Alegría once semanas después de Dallas. Sinceridad tras una década de brillo. Un susurro en un auricular.',"theory.p3":"El bloqueo es una <em>conjunción</em>, no una suma. Dos de tres no te dan dos tercios de una carrera. La tabla de resultados muestra lo que produce cada término ausente.","theory.th.skill":"Destreza","theory.th.env":"Entorno","theory.th.need":"Necesidad","theory.th.outcome":"Resultado","theory.th.example":"Ejemplo","theory.h.window":"Por qué la ventana es corta","theory.p4":"Los tres términos se mueven con relojes distintos. La destreza se acumula despacio, durante años. El entorno cambia a saltos cuando se abre una tecnología o una puerta. La necesidad oscila como un péndulo con un periodo de más o menos una generación, porque cada cohorte quiere lo contrario de lo que tuvieron sus hermanos mayores. El planetario de la escena lo muestra: un anillo lento, un anillo a saltos, un anillo que oscila. Se alinean brevemente.","theory.h.model":"El modelo del péndulo","theory.p5":"Cada época se puntúa en cinco ejes bipolares. Por cada eje se ajusta una sinusoide a las épocas desde {from} (la era de la música grabada, lo bastante densa para resolver un ciclo), con el periodo buscado entre 20 y 50 años, y luego se extrapola con un cono de error. Parámetros ajustados:","theory.th.axis":"Eje","theory.th.period":"Periodo","theory.th.amp":"Amplitud","theory.th.turn":"Próximo giro","theory.yr":"años","theory.h.missing":"Lo que esto deja fuera","theory.li.surv":"Supervivencia: el archivo solo contiene los bloqueos que ocurrieron. Por cada entrada hubo miles con dos de tres.","theory.li.hind":"Retrospectiva: «la cultura lo necesitaba» es fácil de decir después. Las pestañas de pronóstico son la prueba honesta de si la idea predice algo.","theory.li.luck":"La suerte, bien definida, son los dos términos que no controlas. La destreza es el que sí. La estrategia que se sigue no tiene glamur: construir la destreza, acercarse al entorno y seguir ahí cuando la necesidad vuelva a girar.","theory.h.drive":"Cómo funciona el motor","theory.p6":"La nave tiene una posición en el tiempo, una velocidad temporal (años de historia por segundo de tu tiempo) y una aceleración limitada de {amax} años/s², con una resistencia que crece con la velocidad hacia una asíntota de {vmax} años/s. No puedes detenerte al instante. El piloto automático planifica una trayectoria todo-o-nada con una aproximación final amortiguada. Los instrumentos van vestidos de relativistas: <b>γ</b> es el factor de dilatación a tu fracción de la velocidad máxima, el <b>Doppler</b> lleva el signo de la dirección (azul hacia el futuro, rojo hacia el pasado) y desplaza tanto el color del túnel como el tono del motor, la <b>coherencia</b> cae con la aceleración y la velocidad, y el <b>esfuerzo</b> acumula con cuánta violencia has empujado a través del tiempo."};var Ku={"lang.name":"Deutsch","app.title":"Kairos Engine",era:"n. Chr.","intro.eyebrow":"Eine Zeitmaschine durch die Epochen der Musik","intro.lede":"Chronos ist die Zeit, durch die man reist. Kairos ist der Moment, in dem man ankommt: wenn das Können eines Menschen, sein Umfeld und das, was die Kultur brauchte, in einer Person zusammenfallen. Einmal.","intro.body":"Flieg von den Barockhöfen bis in die Ära des Algorithmus und weiter in vier Prognosehorizonte. An jeder Station zeigt das Planetarium die drei Kräfte, die sich ausrichten mussten, und das Dossier nennt, wer im Strahl stand.","intro.engage":"Antrieb zünden, mit Ton","intro.engageQuiet":"Ohne Ton starten","intro.keys":"ziehen zum Umsehen · ← → Schub · Leertaste Bremse · Enter andocken · [ ] Epochen · Scrollen für Impuls",nogl:"Dieser Browser konnte WebGL nicht starten. Das Dossier funktioniert, die 3D-Ansicht nicht.","hud.vt":"v<sub>t</sub>","hud.gamma":"γ","hud.doppler":"Doppler","hud.coherence":"Kohärenz","hud.strain":"Belastung","hud.unit.yrs":"J/s","mode.docked":"ANGEDOCKT","mode.autopilot":"AUTOPILOT","mode.manual":"MANUELL","mode.braking":"BREMSEN","mode.adrift":"TREIBEND","dir.future":"▶ Zukunft","dir.past":"◀ Vergangenheit","dir.rest":"● Ruhe","hud.eta":"→ {year} · Ankunft in {s} s","btn.soundOn":"Ton an","btn.soundOff":"Ton aus","btn.theory":"Theorie","btn.help":"Hilfe","btn.fullscreen":"Vollbild","btn.language":"Sprache","tl.now":"jetzt","tl.marker":"{name} ({a}–{b})","th.past":"Vergangenheit","th.future":"Zukunft","th.title":"Ziehen: Schub in die Vergangenheit (links) oder Zukunft (rechts). Federt auf null zurück.","btn.brake":"Bremsen","btn.brake.title":"Bremsen (Leertaste)","btn.dock":"Andocken","btn.dock.title":"Autopilot zur nächsten Epoche (Enter)","btn.cancel":"Abbrechen","btn.cancel.title":"Autopilot abbrechen (Esc)","btn.prev.title":"Vorige Epoche ([)","btn.next.title":"Nächste Epoche (])","dock.handle":"Dossier ein- oder ausklappen","flash.sub":"{a}–{b} · Vorbeiflug mit {v} J/s","toast.lock.full":"Kairos-Einrastung: Können, Umfeld und Bedürfnis ausgerichtet.","toast.lock.partial":"Teilweise Ausrichtung: ein Term fehlt.","toast.lock.none":"Keine Einrastung: das Bedürfnis war nicht da.","toast.boundary.past":"Zeitgrenze. Das Archiv beginnt {year}; der Antrieb prallte zurück.","toast.boundary.future":"Prognosehorizont. Jenseits von {year} hat das Modell nichts; der Antrieb prallte zurück.","panel.epoch":"Epoche · {a}–{b}","panel.need":"Was die Kultur brauchte","panel.env":"Was das Umfeld möglich machte","panel.cases":"Kairos-Fälle","panel.cases.hint":"einen wählen, um das Planetarium auszurichten","panel.pendulum":"Das Bedürfnis-Pendel","panel.pendulum.fine":"Wo das kulturelle Bedürfnis dieser Epoche auf fünf bipolaren Achsen lag, verglichen mit der Epoche davor. Redaktionelle Werte, die das Prognosemodell verwendet.","fit.skill":"Können","fit.env":"Umfeld","fit.need":"Bedürfnis","status.locked":"Kairos-Einrastung","status.deferred":"Einrastung verzögert","status.partial":"Teilweise Einrastung","case.skill":"Können","case.env":"Umfeld","case.need":"Was die Kultur brauchte","legend.previous":"vorige","void.eyebrow":"Zwischenraum · {y}","void.title":"Zwischen den Epochen","void.lede":"Der Antrieb findet im Jahr {y} keine stabile Resonanz. Es gab Musik, es gab brillante Leute, aber keine dokumentierte Kairos-Einrastung dieses Archivs liegt hier.","void.tip":"Tipp: Der Schub ist auf {amax} J/s² begrenzt, die Höchstgeschwindigkeit auf {vmax} J/s. Der Autopilot plant den Bremspunkt; im Handflug musst du vor dem Ziel bremsen, sonst schießt du darüber hinaus.","fc.eyebrow":"Prognose · +{n} {years} · {year}","fc.year":"Jahr","fc.years":"Jahre","fc.confidence":"Konfidenz","fc.need":"Was die Kultur brauchen wird","fc.env":"Das Umfeld","fc.skills":"Welches Können belohnt wird","fc.who":"Bei wem es einrastet","fc.model":"Was das Pendelmodell sagt","fc.model.legend":"Modell, {year}","fc.dir.center":"<b>{neg} ↔ {pos}</b>: nahe der Mitte, in Bewegung Richtung {toward}.","fc.dir.strong":"<b>{neg} ↔ {pos}</b>: deutlich Richtung {pole}, in Bewegung Richtung {toward}.","fc.dir.moderate":"<b>{neg} ↔ {pos}</b>: moderat Richtung {pole}, in Bewegung Richtung {toward}.","fc.fine":"Das ist ein Spielzeug: eine Sinuskurve, angepasst an die {n} von Hand bewerteten Epochen seit {from}, mit einer Periodensuche zwischen 20 und 50 Jahren, extrapoliert mit einem sich weitenden Fehlerkegel. Die geschriebene Prognose oben ist die Lesart eines Analysten, der das Modell als eine Quelle unter mehreren nutzt. Wo beide auseinandergehen, traue keinem von beiden allzu sehr. Nach {year} deckt der Kegel die ganze Achse ab: So gibt das Modell zu, dass es nichts weiß.","chart.band":"Modell ± 1σ","chart.now":"jetzt","chart.caption":"Angepasste Periode {p} Jahre, Amplitude {a}, Residuum σ {s}. Nächster Wendepunkt um {y}. Die Punkte sind die Epochen seit {from}; der schattierte Kegel ist ±1σ und weitet sich mit der Distanz.","chart.aria.pendulum":"Kulturelles Bedürfnis auf fünf bipolaren Achsen","chart.aria.forecast":"Von {neg} zu {pos} über die Zeit mit Prognoseband","chart.previous":"vorige","axis.sincerity.neg":"Künstlichkeit","axis.sincerity.pos":"Aufrichtigkeit","axis.communal.neg":"Individuell","axis.communal.pos":"Gemeinschaftlich","axis.body.neg":"Kopf","axis.body.pos":"Körper","axis.local.neg":"Global","axis.local.pos":"Lokal","axis.rough.neg":"Poliert","axis.rough.pos":"Roh","outcome.0":"Kairos-Einrastung","outcome.0.ex":"The Beatles, 1964","outcome.1":"Ihrer Zeit voraus, oder sie ziehen um","outcome.1.ex":"Hendrix vor London, 1966","outcome.2":"Geachteter Handwerker, vergessen","outcome.2.ex":"Bach, 1740er","outcome.3":"Ein Hit, oder die Coverversion gewinnt","outcome.3.ex":"Die Novelty-Single","outcome.4":"Lokale Legende","outcome.4.ex":"Jede großartige Kneipenband","outcome.5":"Labelprodukt, das nicht zündet","outcome.5.ex":"Die meisten Major-Debüts","outcome.6":"Das Bedürfnis wartet auf jemand anderen","outcome.6.ex":"Punk vor 1976","help.eyebrow":"Steuerung","help.title":"Den Antrieb fliegen","help.1":"<kbd>←</kbd> <kbd>→</kbd> oder den Schubhebel ziehen: Schub in die Vergangenheit oder Zukunft. Loslassen, und du gleitest weiter.","help.2":"<kbd>Leertaste</kbd> oder <b>Bremsen</b>: Schub gegen die Bewegung, bis du stehst.","help.3":"<kbd>Enter</kbd> oder <b>Andocken</b>: Autopilot zur nächsten Epoche.","help.4":"<kbd>[</kbd> <kbd>]</kbd>: Autopilot zur vorigen oder nächsten Epoche. Ein Klick auf die Zeitleiste tut dasselbe für jedes Jahr.","help.5":"Mausrad über der Ansicht: ein Geschwindigkeitsimpuls. Ansicht ziehen, um dich umzusehen.","help.6":"<kbd>m</kbd> Ton · <kbd>t</kbd> Theorie · <kbd>Esc</kbd> Autopilot abbrechen oder ein Panel schließen.","help.fine":"In einer Epoche wählst du einen Kairos-Fall, um das Planetarium auszurichten. Jenseits von 2026 flackern die Welten: Das ist die Prognoseunsicherheit, sichtbar gemacht.","theory.eyebrow":"Theorie","theory.title":"Chronos und Kairos","theory.p1":"Die Griechen hatten zwei Wörter für Zeit. <b>Chronos</b> ist die Zeit, durch die man reist: sequenziell, messbar, die Art, gegen die dieser Antrieb drückt. <b>Kairos</b> ist der günstige Moment: der Augenblick, in dem das, was du kannst, genau das ist, wofür die Welt bereit ist. Diese Maschine bewegt sich durch Chronos, um Kairos zu finden.","theory.h.lock":"Die Einrastbedingung","theory.p2":"Jeder Künstler in diesem Archiv, der es „geschafft“ hat, tat das, als drei unabhängige Größen gleichzeitig ihre Schwellen überschritten:","theory.li.skill":'<b class="k-skill">Können</b>: die konkrete Fähigkeit, die der Moment verlangt. Keine Konservatoriumsnote. Bei den Sex Pistols war es Haltung, bei Caruso eine Stimme wie gemacht für den Trichter.',"theory.li.env":'<b class="k-env">Umfeld</b>: die Technik, das Geschäft, die Stadt, die Türsteher und wen das System durchlässt. Mikrofone, Race Records, MTV, SoundScan, Spotify, TikTok.',"theory.li.need":'<b class="k-need">Kulturelles Bedürfnis</b>: wonach eine Bevölkerung genau dann hungerte. Freude elf Wochen nach Dallas. Aufrichtigkeit nach einem Jahrzehnt Hochglanz. Ein Flüstern im Ohrhörer.',"theory.p3":"Die Einrastung ist eine <em>Konjunktion</em>, keine Summe. Zwei von drei ergeben nicht zwei Drittel einer Karriere. Die Ergebnistabelle zeigt, was jeder fehlende Term hervorbringt.","theory.th.skill":"Können","theory.th.env":"Umfeld","theory.th.need":"Bedürfnis","theory.th.outcome":"Ergebnis","theory.th.example":"Beispiel","theory.h.window":"Warum das Fenster kurz ist","theory.p4":"Die drei Terme laufen nach verschiedenen Uhren. Können sammelt sich langsam über Jahre an. Das Umfeld ändert sich in Sprüngen, wenn eine Technik oder ein Tor aufgeht. Das Bedürfnis schwingt wie ein Pendel mit einer Periode von etwa einer Generation, weil jede Kohorte das Gegenteil dessen will, was die älteren Geschwister hatten. Das Planetarium in der Szene zeigt das: ein langsamer Ring, ein springender Ring, ein schwingender Ring. Sie richten sich kurz aus.","theory.h.model":"Das Pendelmodell","theory.p5":"Jede Epoche wird auf fünf bipolaren Achsen bewertet. Pro Achse wird eine Sinuskurve an die Epochen seit {from} angepasst (die Ära der Tonaufnahme, dicht genug, um einen Zyklus aufzulösen), mit einer Periodensuche zwischen 20 und 50 Jahren, und dann mit einem Fehlerkegel extrapoliert. Angepasste Parameter:","theory.th.axis":"Achse","theory.th.period":"Periode","theory.th.amp":"Amplitude","theory.th.turn":"Nächste Wende","theory.yr":"J.","theory.h.missing":"Was hier fehlt","theory.li.surv":"Überlebensverzerrung: Das Archiv enthält nur Einrastungen, die stattfanden. Auf jeden Eintrag kamen Tausende mit zwei von drei.","theory.li.hind":"Rückschau: „Die Kultur brauchte es“ sagt sich hinterher leicht. Die Prognose-Tabs sind der ehrliche Test, ob die Idee irgendetwas vorhersagt.","theory.li.luck":"Glück, sauber definiert, sind die zwei Terme, die du nicht kontrollierst. Können ist der, den du kontrollierst. Die Strategie daraus ist unglamourös: das Können aufbauen, sich dem Umfeld nähern und noch da sein, wenn das Bedürfnis herumschwingt.","theory.h.drive":"Wie der Antrieb funktioniert","theory.p6":"Das Schiff hat eine Position in der Zeit, eine Zeitgeschwindigkeit (Jahre Geschichte pro Sekunde deiner Zeit) und eine begrenzte Beschleunigung von {amax} J/s², mit einem Widerstand, der mit der Geschwindigkeit gegen eine Asymptote von {vmax} J/s wächst. Sofort anhalten geht nicht. Der Autopilot plant eine Bang-Bang-Trajektorie mit gedämpftem Endanflug. Die Instrumente sind als relativistische Anzeigen verkleidet: <b>γ</b> ist der Dilatationsfaktor bei deinem Anteil der Höchstgeschwindigkeit, der <b>Doppler</b> trägt das Vorzeichen der Richtung (blau in die Zukunft, rot in die Vergangenheit) und verschiebt Tunnelfarbe wie Motortonhöhe, die <b>Kohärenz</b> fällt mit Beschleunigung und Geschwindigkeit, und die <b>Belastung</b> integriert, wie heftig du durch die Zeit gedrückt hast."};var Yu={"lang.name":"Français","app.title":"Kairos Engine",era:"apr. J.-C.","intro.eyebrow":"Une machine à voyager dans les époques de la musique","intro.lede":"Chronos est le temps que l'on traverse. Kairos est l'instant où l'on arrive : quand le talent de quelqu'un, son environnement et ce dont la culture avait besoin convergent sur une seule personne, une seule fois.","intro.body":"Volez des cours baroques jusqu'à l'ère de l'algorithme, puis vers quatre horizons de prévision. À chaque escale, le planétaire montre les trois forces qui devaient s'aligner, et le dossier nomme ceux qui se sont trouvés dans le faisceau.","intro.engage":"Lancer le moteur, avec le son","intro.engageQuiet":"Lancer en silence","intro.keys":"glisser pour regarder · ← → poussée · espace frein · entrée amarrage · [ ] époques · molette pour une impulsion",nogl:"Ce navigateur n'a pas pu démarrer WebGL. Le dossier fonctionne ; la vue 3D non.","hud.vt":"v<sub>t</sub>","hud.gamma":"γ","hud.doppler":"Doppler","hud.coherence":"Cohérence","hud.strain":"Contrainte","hud.unit.yrs":"ans/s","mode.docked":"AMARRÉ","mode.autopilot":"PILOTE AUTO","mode.manual":"MANUEL","mode.braking":"FREINAGE","mode.adrift":"À LA DÉRIVE","dir.future":"▶ futur","dir.past":"◀ passé","dir.rest":"● repos","hud.eta":"→ {year} · arrivée dans {s} s","btn.soundOn":"Son activé","btn.soundOff":"Son coupé","btn.theory":"Théorie","btn.help":"Aide","btn.fullscreen":"Plein écran","btn.language":"Langue","tl.now":"maintenant","tl.marker":"{name} ({a}–{b})","th.past":"passé","th.future":"futur","th.title":"Glissez : poussée vers le passé (gauche) ou le futur (droite). Revient à zéro quand on relâche.","btn.brake":"Freiner","btn.brake.title":"Freiner (espace)","btn.dock":"Amarrer","btn.dock.title":"Pilote automatique vers l'époque la plus proche (entrée)","btn.cancel":"Annuler","btn.cancel.title":"Annuler le pilote automatique (échap)","btn.prev.title":"Époque précédente ([)","btn.next.title":"Époque suivante (])","dock.handle":"Replier ou déplier le dossier","flash.sub":"{a}–{b} · passage à {v} ans/s","toast.lock.full":"Verrouillage du Kairos : talent, environnement et besoin alignés.","toast.lock.partial":"Alignement partiel : il manque un terme.","toast.lock.none":"Pas de verrouillage : le besoin n'était pas là.","toast.boundary.past":"Frontière temporelle. L'archive commence en {year} ; le moteur a reculé.","toast.boundary.future":"Horizon de prévision. Au-delà de {year}, le modèle n'a rien ; le moteur a reculé.","panel.epoch":"Époque · {a}–{b}","panel.need":"Ce dont la culture avait besoin","panel.env":"Ce que l'environnement a rendu possible","panel.cases":"Cas de Kairos","panel.cases.hint":"choisissez-en un pour aligner le planétaire","panel.pendulum":"Le pendule du besoin","panel.pendulum.fine":"Où se situait le besoin culturel de cette époque sur cinq axes bipolaires, comparé à l'époque précédente. Notes éditoriales, utilisées par le modèle de prévision.","fit.skill":"Talent","fit.env":"Environnement","fit.need":"Besoin","status.locked":"Verrouillage du Kairos","status.deferred":"Verrouillage différé","status.partial":"Verrouillage partiel","case.skill":"Talent","case.env":"Environnement","case.need":"Ce dont la culture avait besoin","legend.previous":"précédente","void.eyebrow":"Interstice · {y}","void.title":"Entre deux époques","void.lede":"Le moteur ne trouve aucune résonance stable en {y}. Il y avait de la musique, il y avait des gens brillants, mais aucun verrouillage du Kairos documenté dans cette archive ne tombe ici.","void.tip":"Conseil : la poussée est limitée à {amax} ans/s² et la vitesse maximale à {vmax} ans/s. Le pilote automatique calcule le point de freinage ; en vol manuel, il faut freiner avant la cible, sinon vous la dépasserez.","fc.eyebrow":"Prévision · +{n} {years} · {year}","fc.year":"an","fc.years":"ans","fc.confidence":"Confiance","fc.need":"Ce dont la culture aura besoin","fc.env":"L'environnement","fc.skills":"Les talents qui seront récompensés","fc.who":"Chez qui ça se verrouille","fc.model":"Ce que dit le modèle du pendule","fc.model.legend":"modèle, {year}","fc.dir.center":"<b>{neg} ↔ {pos}</b> : près du centre, en mouvement vers {toward}.","fc.dir.strong":"<b>{neg} ↔ {pos}</b> : nettement vers {pole}, en mouvement vers {toward}.","fc.dir.moderate":"<b>{neg} ↔ {pos}</b> : modérément vers {pole}, en mouvement vers {toward}.","fc.fine":"Ceci est un jouet : une sinusoïde ajustée aux {n} époques notées à la main depuis {from}, avec une période cherchée entre 20 et 50 ans, extrapolée avec un cône d'erreur qui s'élargit. La prévision écrite ci-dessus est la lecture d'un analyste qui utilise le modèle comme une source parmi d'autres. Là où ils divergent, ne faites trop confiance ni à l'un ni à l'autre. Passé {year}, le cône couvre tout l'axe : c'est le modèle qui avoue qu'il ne sait pas.","chart.band":"modèle ± 1σ","chart.now":"maintenant","chart.caption":"Période ajustée {p} ans, amplitude {a}, σ résiduel {s}. Prochain point de retournement vers {y}. Les points sont les époques depuis {from} ; le cône ombré est ±1σ et s'élargit avec la distance.","chart.aria.pendulum":"Besoin culturel sur cinq axes bipolaires","chart.aria.forecast":"De {neg} à {pos} dans le temps avec bande de prévision","chart.previous":"précédente","axis.sincerity.neg":"Artifice","axis.sincerity.pos":"Sincérité","axis.communal.neg":"Individuel","axis.communal.pos":"Collectif","axis.body.neg":"Esprit","axis.body.pos":"Corps","axis.local.neg":"Global","axis.local.pos":"Local","axis.rough.neg":"Poli","axis.rough.pos":"Brut","outcome.0":"Verrouillage du Kairos","outcome.0.ex":"The Beatles, 1964","outcome.1":"En avance sur leur temps, ou ils déménagent","outcome.1.ex":"Hendrix avant Londres, 1966","outcome.2":"Artisan respecté, oublié","outcome.2.ex":"Bach, années 1740","outcome.3":"Un seul tube, ou la reprise l'emporte","outcome.3.ex":"Le single de circonstance","outcome.4":"Légende locale","outcome.4.ex":"Tout grand groupe de bar","outcome.5":"Produit de maison de disques qui ne prend pas","outcome.5.ex":"La plupart des premiers albums chez les majors","outcome.6":"Le besoin attend quelqu'un d'autre","outcome.6.ex":"Le punk avant 1976","help.eyebrow":"Commandes","help.title":"Piloter le moteur","help.1":"<kbd>←</kbd> <kbd>→</kbd> ou glissez la manette : poussée vers le passé ou le futur. Relâchez et vous continuez sur votre élan.","help.2":"<kbd>espace</kbd> ou <b>Freiner</b> : poussée contre votre mouvement jusqu'à l'arrêt.","help.3":"<kbd>entrée</kbd> ou <b>Amarrer</b> : pilote automatique vers l'époque la plus proche.","help.4":"<kbd>[</kbd> <kbd>]</kbd> : pilote automatique vers l'époque précédente ou suivante. Un clic sur la frise fait de même pour n'importe quelle année.","help.5":"Molette de la souris sur la vue : une impulsion de vitesse. Glissez la vue pour regarder autour de vous.","help.6":"<kbd>m</kbd> son · <kbd>t</kbd> théorie · <kbd>échap</kbd> annuler le pilote automatique ou fermer un panneau.","help.fine":"Dans une époque, choisissez un cas de Kairos pour aligner le planétaire. Au-delà de 2026, les mondes scintillent : c'est l'incertitude de la prévision, rendue visible.","theory.eyebrow":"Théorie","theory.title":"Chronos et Kairos","theory.p1":"Les Grecs avaient deux mots pour le temps. <b>Chronos</b> est le temps que l'on traverse : séquentiel, mesurable, celui contre lequel ce moteur pousse. <b>Kairos</b> est le moment opportun : l'instant où ce que vous savez faire est exactement ce à quoi le monde est prêt. Cette machine traverse Chronos pour trouver Kairos.","theory.h.lock":"La condition de verrouillage","theory.p2":"Chaque artiste de cette archive qui a « percé » l'a fait quand trois grandeurs indépendantes ont franchi leurs seuils en même temps :","theory.li.skill":`<b class="k-skill">Talent</b> : la capacité précise que réclame le moment. Pas une note de conservatoire. Pour les Sex Pistols, c'était l'attitude ; pour Caruso, une voix faite pour le pavillon.`,"theory.li.env":`<b class="k-env">Environnement</b> : la technologie, l'industrie, la ville, les gardiens de la porte, et qui le système accepte de laisser passer. Micros, race records, MTV, SoundScan, Spotify, TikTok.`,"theory.li.need":'<b class="k-need">Besoin culturel</b> : ce dont une population avait faim à ce moment précis. De la joie onze semaines après Dallas. De la sincérité après une décennie de brillant. Un murmure dans un écouteur.',"theory.p3":"Le verrouillage est une <em>conjonction</em>, pas une somme. Deux sur trois ne donnent pas deux tiers de carrière. Le tableau des issues montre ce que produit chaque terme manquant.","theory.th.skill":"Talent","theory.th.env":"Env.","theory.th.need":"Besoin","theory.th.outcome":"Issue","theory.th.example":"Exemple","theory.h.window":"Pourquoi la fenêtre est courte","theory.p4":"Les trois termes avancent sur des horloges différentes. Le talent s'accumule lentement, sur des années. L'environnement change par paliers quand une technologie ou une porte s'ouvre. Le besoin oscille comme un pendule avec une période d'environ une génération, parce que chaque cohorte veut le contraire de ce qu'ont eu ses aînés. Le planétaire de la scène le montre : un anneau lent, un anneau par paliers, un anneau qui oscille. Ils s'alignent brièvement.","theory.h.model":"Le modèle du pendule","theory.p5":"Chaque époque est notée sur cinq axes bipolaires. Pour chaque axe, une sinusoïde est ajustée aux époques depuis {from} (l'ère de la musique enregistrée, assez dense pour résoudre un cycle), avec une période cherchée entre 20 et 50 ans, puis extrapolée avec un cône d'erreur. Paramètres ajustés :","theory.th.axis":"Axe","theory.th.period":"Période","theory.th.amp":"Amplitude","theory.th.turn":"Prochain retournement","theory.yr":"ans","theory.h.missing":"Ce que cela laisse de côté","theory.li.surv":"Biais du survivant : l'archive ne contient que les verrouillages qui ont eu lieu. Pour chaque entrée, il y en a eu des milliers avec deux sur trois.","theory.li.hind":"Rétrospective : « la culture en avait besoin » est facile à dire après coup. Les onglets de prévision sont le test honnête de ce que l'idée prédit vraiment.","theory.li.luck":"La chance, bien définie, ce sont les deux termes que vous ne contrôlez pas. Le talent est celui que vous contrôlez. La stratégie qui en découle n'a rien de glamour : construire le talent, se rapprocher de l'environnement, et être encore là quand le besoin revient dans votre sens.","theory.h.drive":"Comment fonctionne le moteur","theory.p6":"Le vaisseau a une position dans le temps, une vitesse temporelle (années d'histoire par seconde de votre temps) et une accélération bornée à {amax} ans/s², avec une traînée qui croît avec la vitesse vers une asymptote de {vmax} ans/s. On ne peut pas s'arrêter net. Le pilote automatique planifie une trajectoire tout-ou-rien avec une approche finale amortie. Les instruments sont habillés en relativistes : <b>γ</b> est le facteur de dilatation à votre fraction de la vitesse maximale, le <b>Doppler</b> porte le signe de la direction (bleu vers le futur, rouge vers le passé) et décale à la fois la couleur du tunnel et la hauteur du moteur, la <b>cohérence</b> chute avec l'accélération et la vitesse, et la <b>contrainte</b> cumule la violence avec laquelle vous avez poussé à travers le temps."};var $u={"lang.name":"Português","app.title":"Kairos Engine",era:"d.C.","intro.eyebrow":"Uma máquina do tempo pelas épocas da música","intro.lede":"Chronos é o tempo que você atravessa. Kairós é o momento em que você chega: quando a habilidade de alguém, seu ambiente e o que a cultura precisava convergem em uma só pessoa, uma só vez.","intro.body":"Voe das cortes barrocas até a era do algoritmo e siga por quatro horizontes de previsão. Em cada parada, o planetário mostra as três forças que precisavam se alinhar, e o dossiê diz quem ficou no feixe de luz.","intro.engage":"Ligar o motor, com som","intro.engageQuiet":"Ligar em silêncio","intro.keys":"arraste para olhar · ← → empuxo · espaço freio · enter acoplar · [ ] épocas · roda do mouse para impulso",nogl:"Este navegador não conseguiu iniciar o WebGL. O dossiê funciona; a vista 3D não.","hud.vt":"v<sub>t</sub>","hud.gamma":"γ","hud.doppler":"Doppler","hud.coherence":"Coerência","hud.strain":"Esforço","hud.unit.yrs":"anos/s","mode.docked":"ACOPLADO","mode.autopilot":"PILOTO AUTO","mode.manual":"MANUAL","mode.braking":"FREANDO","mode.adrift":"À DERIVA","dir.future":"▶ futuro","dir.past":"◀ passado","dir.rest":"● repouso","hud.eta":"→ {year} · chegada em {s} s","btn.soundOn":"Som ligado","btn.soundOff":"Som desligado","btn.theory":"Teoria","btn.help":"Ajuda","btn.fullscreen":"Tela cheia","btn.language":"Idioma","tl.now":"agora","tl.marker":"{name} ({a}–{b})","th.past":"passado","th.future":"futuro","th.title":"Arraste: empuxo para o passado (esquerda) ou o futuro (direita). Volta a zero ao soltar.","btn.brake":"Frear","btn.brake.title":"Frear (espaço)","btn.dock":"Acoplar","btn.dock.title":"Piloto automático até a época mais próxima (enter)","btn.cancel":"Cancelar","btn.cancel.title":"Cancelar o piloto automático (esc)","btn.prev.title":"Época anterior ([)","btn.next.title":"Próxima época (])","dock.handle":"Recolher ou expandir o dossiê","flash.sub":"{a}–{b} · passando a {v} anos/s","toast.lock.full":"Trava de Kairós: habilidade, ambiente e necessidade alinhados.","toast.lock.partial":"Alinhamento parcial: falta um termo.","toast.lock.none":"Sem trava: a necessidade não estava lá.","toast.boundary.past":"Fronteira temporal. O arquivo começa em {year}; o motor recuou.","toast.boundary.future":"Horizonte de previsão. Além de {year} o modelo não tem nada; o motor recuou.","panel.epoch":"Época · {a}–{b}","panel.need":"O que a cultura precisava","panel.env":"O que o ambiente tornou possível","panel.cases":"Casos de Kairós","panel.cases.hint":"escolha um para alinhar o planetário","panel.pendulum":"O pêndulo da necessidade","panel.pendulum.fine":"Onde a necessidade cultural desta época estava em cinco eixos bipolares, comparada à época anterior. Notas editoriais, usadas pelo modelo de previsão.","fit.skill":"Habilidade","fit.env":"Ambiente","fit.need":"Necessidade","status.locked":"Trava de Kairós","status.deferred":"Trava adiada","status.partial":"Trava parcial","case.skill":"Habilidade","case.env":"Ambiente","case.need":"O que a cultura precisava","legend.previous":"anterior","void.eyebrow":"Interstício · {y}","void.title":"Entre épocas","void.lede":"O motor não encontra ressonância estável em {y}. Havia música, havia gente brilhante, mas nenhuma trava de Kairós documentada neste arquivo cai aqui.","void.tip":"Dica: o empuxo é limitado a {amax} anos/s² e a velocidade máxima a {vmax} anos/s. O piloto automático planeja o ponto de frenagem; em voo manual é preciso frear antes do alvo, senão você passa direto.","fc.eyebrow":"Previsão · +{n} {years} · {year}","fc.year":"ano","fc.years":"anos","fc.confidence":"Confiança","fc.need":"O que a cultura vai precisar","fc.env":"O ambiente","fc.skills":"Habilidades que serão recompensadas","fc.who":"Em quem a trava acontece","fc.model":"O que diz o modelo do pêndulo","fc.model.legend":"modelo, {year}","fc.dir.center":"<b>{neg} ↔ {pos}</b>: perto do centro, movendo-se para {toward}.","fc.dir.strong":"<b>{neg} ↔ {pos}</b>: fortemente para {pole}, movendo-se para {toward}.","fc.dir.moderate":"<b>{neg} ↔ {pos}</b>: moderadamente para {pole}, movendo-se para {toward}.","fc.fine":"Isto é um brinquedo: uma senoide ajustada às {n} épocas pontuadas à mão desde {from}, com o período buscado entre 20 e 50 anos, extrapolada com um cone de erro que se alarga. A previsão escrita acima é a leitura de um analista que usa o modelo como uma entrada entre outras. Onde discordam, não confie muito em nenhum dos dois. Depois de {year} o cone cobre o eixo inteiro: é o modelo admitindo que não sabe.","chart.band":"modelo ± 1σ","chart.now":"agora","chart.caption":"Período ajustado {p} anos, amplitude {a}, σ residual {s}. Próximo ponto de virada por volta de {y}. Os pontos são as épocas desde {from}; o cone sombreado é ±1σ e se alarga com a distância.","chart.aria.pendulum":"Necessidade cultural em cinco eixos bipolares","chart.aria.forecast":"De {neg} a {pos} ao longo do tempo com faixa de previsão","chart.previous":"anterior","axis.sincerity.neg":"Artifício","axis.sincerity.pos":"Sinceridade","axis.communal.neg":"Individual","axis.communal.pos":"Coletivo","axis.body.neg":"Mente","axis.body.pos":"Corpo","axis.local.neg":"Global","axis.local.pos":"Local","axis.rough.neg":"Polido","axis.rough.pos":"Cru","outcome.0":"Trava de Kairós","outcome.0.ex":"The Beatles, 1964","outcome.1":"À frente do tempo, ou se mudam","outcome.1.ex":"Hendrix antes de Londres, 1966","outcome.2":"Artesão respeitado, esquecido","outcome.2.ex":"Bach, anos 1740","outcome.3":"Um hit só, ou a versão cover vence","outcome.3.ex":"O single de novidade","outcome.4":"Lenda local","outcome.4.ex":"Toda grande banda de bar","outcome.5":"Aposta de gravadora que não pega","outcome.5.ex":"A maioria das estreias em grandes gravadoras","outcome.6":"A necessidade espera por outra pessoa","outcome.6.ex":"O punk antes de 1976","help.eyebrow":"Controles","help.title":"Pilotando o motor","help.1":"<kbd>←</kbd> <kbd>→</kbd> ou arraste a alavanca: empuxo para o passado ou o futuro. Solte e você segue por inércia.","help.2":"<kbd>espaço</kbd> ou <b>Frear</b>: empuxo contra o seu movimento até parar.","help.3":"<kbd>enter</kbd> ou <b>Acoplar</b>: piloto automático até a época mais próxima.","help.4":"<kbd>[</kbd> <kbd>]</kbd>: piloto automático até a época anterior ou a próxima. Clicar na linha do tempo faz o mesmo para qualquer ano.","help.5":"Roda do mouse sobre a vista: um impulso de velocidade. Arraste a vista para olhar ao redor.","help.6":"<kbd>m</kbd> som · <kbd>t</kbd> teoria · <kbd>esc</kbd> cancelar o piloto automático ou fechar um painel.","help.fine":"Dentro de uma época, escolha um caso de Kairós para alinhar o planetário. Depois de 2026 os mundos tremulam: é a incerteza da previsão, tornada visível.","theory.eyebrow":"Teoria","theory.title":"Chronos e Kairós","theory.p1":"Os gregos tinham duas palavras para o tempo. <b>Chronos</b> é o tempo que você atravessa: sequencial, mensurável, o tipo contra o qual este motor empurra. <b>Kairós</b> é o momento oportuno: o instante em que aquilo que você sabe fazer é exatamente aquilo para o qual o mundo está pronto. Esta máquina se move por Chronos para encontrar Kairós.","theory.h.lock":"A condição de trava","theory.p2":"Todo artista deste arquivo que “chegou lá” o fez quando três grandezas independentes cruzaram seus limiares ao mesmo tempo:","theory.li.skill":'<b class="k-skill">Habilidade</b>: a capacidade específica que o momento pede. Não é nota de conservatório. Para os Sex Pistols foi a atitude; para Caruso, uma voz feita para a corneta.',"theory.li.env":'<b class="k-env">Ambiente</b>: a tecnologia, o negócio, a cidade, os porteiros e quem o sistema está disposto a deixar passar. Microfones, race records, MTV, SoundScan, Spotify, TikTok.',"theory.li.need":'<b class="k-need">Necessidade cultural</b>: do que uma população tinha fome bem naquele momento. Alegria onze semanas depois de Dallas. Sinceridade depois de uma década de brilho. Um sussurro no fone de ouvido.',"theory.p3":"A trava é uma <em>conjunção</em>, não uma soma. Dois de três não dão dois terços de uma carreira. A tabela de resultados mostra o que cada termo ausente produz.","theory.th.skill":"Habilidade","theory.th.env":"Ambiente","theory.th.need":"Necessidade","theory.th.outcome":"Resultado","theory.th.example":"Exemplo","theory.h.window":"Por que a janela é curta","theory.p4":"Os três termos correm em relógios diferentes. A habilidade se acumula devagar, ao longo de anos. O ambiente muda em degraus, quando uma tecnologia ou uma porta se abre. A necessidade balança como um pêndulo com período de mais ou menos uma geração, porque cada coorte quer o oposto do que os irmãos mais velhos tiveram. O planetário na cena mostra isso: um anel lento, um anel em degraus, um anel que oscila. Eles se alinham por pouco tempo.","theory.h.model":"O modelo do pêndulo","theory.p5":"Cada época recebe notas em cinco eixos bipolares. Para cada eixo, uma senoide é ajustada às épocas desde {from} (a era da música gravada, densa o bastante para resolver um ciclo), com o período buscado entre 20 e 50 anos, e depois extrapolada com um cone de erro. Parâmetros ajustados:","theory.th.axis":"Eixo","theory.th.period":"Período","theory.th.amp":"Amplitude","theory.th.turn":"Próxima virada","theory.yr":"anos","theory.h.missing":"O que fica de fora","theory.li.surv":"Viés de sobrevivência: o arquivo só contém as travas que aconteceram. Para cada entrada houve milhares com dois de três.","theory.li.hind":"Retrospectiva: “a cultura precisava disso” é fácil de dizer depois. As abas de previsão são o teste honesto de se a ideia prevê alguma coisa.","theory.li.luck":"Sorte, bem definida, são os dois termos que você não controla. Habilidade é o que você controla. A estratégia que decorre disso não tem glamour: construir a habilidade, aproximar-se do ambiente e ainda estar lá quando a necessidade voltar a girar.","theory.h.drive":"Como o motor funciona","theory.p6":"A nave tem uma posição no tempo, uma velocidade temporal (anos de história por segundo do seu tempo) e uma aceleração limitada a {amax} anos/s², com um arrasto que cresce com a velocidade rumo a uma assíntota de {vmax} anos/s. Não dá para parar na hora. O piloto automático planeja uma trajetória tudo-ou-nada com aproximação final amortecida. Os instrumentos estão vestidos de relativistas: <b>γ</b> é o fator de dilatação na sua fração da velocidade máxima, o <b>Doppler</b> tem o sinal da direção (azul rumo ao futuro, vermelho rumo ao passado) e desloca tanto a cor do túnel quanto o tom do motor, a <b>coerência</b> cai com aceleração e velocidade, e o <b>esforço</b> acumula com quanta violência você empurrou através do tempo."};var Ju={baroque:{name:"Барочные дворы",short:"Барокко",tagline:"Музыка как архитектура веры и власти.",need:"Порядок. Континент, всё ещё отстраивающийся после века религиозных войн, хотел музыки, доказывающей, что мироздание устроено по замыслу: контрапункт как доказательство Бога, церемония как доказательство короля.",environment:["Покровительство церкви и двора: композитор был служащим, а не звездой","Орган и клавесин; распространяется хорошо темперированный строй","Гравированные партитуры печатают в Амстердаме и Лондоне: медленно, но на всю Европу","Венеция и Лондон изобретают платящую публику"],artists:[{name:"Георг Фридрих Гендель",place:"Лондон и Дублин",headline:"Первый композитор, сделавший своим покровителем публику, а не князя.",skill:"Ремесло итальянской оперы, освоенное в Риме и Венеции, плюс чутьё на зрелище и хор, который хочется петь.",environment:"Лондон был самым коммерческим музыкальным городом Европы: опера по подписке, а когда опера разорилась — оратория в театрах.",need:"Поднимающийся протестантский средний класс хотел величия на родном языке и с моралью. «Мессия» (Дублин, 1742) дал ему Писание в формате блокбастера.",kairos:"Когда итальянская опера рухнула, Гендель переключился на английскую ораторию ровно в тот момент, когда новая публика смогла за неё платить."},{name:"Иоганн Себастьян Бах",place:"Лейпциг → Берлин",headline:"Высшее мастерство, не то десятилетие. Его Кайрос наступил через 79 лет после смерти.",skill:"Самая полная контрапунктическая техника в западной музыке, выработанная на службе церковного музыканта в Лейпциге с 1723 года.",environment:"Лютеранский городской совет, которому нужны были добротные кантаты, почти без печати и без концертного круга. К 1750 году его стиль читался как старомодный.",need:"В 1829 году Феликс Мендельсон возродил в Берлине «Страсти по Матфею». Романтической Германии, жаждавшей национального гения-предка, внезапно понадобилось именно то, чем Бах был всегда.",kairos:"Умение и среда были на месте в 1725 году; запроса не было. Запрос пришёл в 1829-м, и захват сработал на покойнике.",note:"Урок: захват Кайроса — это конъюнкция. Два из трёх дают уважаемого местного мастера."},{name:"Антонио Вивальди",place:"Венеция → Амстердам",headline:"Концерт как аттракцион, экспортированный печатным станком.",skill:"Скрипичная виртуозность и формула концерта «быстро—медленно—быстро», которую мог скопировать любой в Европе.",environment:"Оспедале делла Пьета дало ему оркестр из обученных воспитанниц-сирот, для которого он писал еженедельно; Этьен Роже в Амстердаме напечатал «L'estro armonico» (1711) для всей Европы.",need:"Путешественники Гран-тура и северные дворы хотели звука Венеции: блестящего, быстрого, современного.",kairos:"Домашний оркестр, чтобы пробовать, печатник, чтобы распространять, и континент, который хотел Венецию в коробке."}]},classical:{name:"Классическая Вена",short:"Классицизм",tagline:"Просвещённый разум, который можно напеть.",need:"Ясность и остроумие. После барочного орнамента Просвещение хотело музыки, которая рассуждает как хорошее эссе: тема, конфликт, развязка, понятные каждому. А новая буржуазная публика хотела оказаться в зале.",environment:["Вена как имперская столица, полная аристократов-любителей","Фортепиано вытесняет клавесин; динамика становится выражением","Публичные концерты по подписке и нотные издатели (Артариа) рядом с придворными должностями","Реформы Иосифа II ненадолго ослабляют цензуру и покровительство"],artists:[{name:"Вольфганг Амадей Моцарт",place:"Вена",headline:"Свободный гений в единственном городе, который ненадолго позволил композитору быть свободным.",skill:"Вундеркинд, обученный десятилетием европейских гастролей; мелодия, оперная характеристика и скорость.",environment:"Вена после 1781 года: концерты по подписке, ученики по фортепиано, издатели, открытый двор императора Иосифа II. Лоренцо Да Понте для слов.",need:"Просвещённая Вена хотела социальной сатиры с человеческим лицом. «Свадьба Фигаро» (1786) позволила слугам перехитрить графа за десятилетие до Французской революции.",kairos:"Его захват держался, пока держалась среда. Серия концертов по подписке угасла уже после 1786 года; когда Турецкая война 1788-го вытянула деньги аристократии, его попытка возродить её в 1789 году собрала одного подписчика.",note:"Урок: захват может разомкнуться. Среда — переменная, а не константа."},{name:"Йозеф Гайдн",place:"Эстерхаза → Лондон",headline:"Тридцать лет в уединённом дворе — и лондонская суперзвезда в 58.",skill:"Он создал словарь симфонии и струнного квартета, имея под рукой оркестр, на котором можно было проверить любую идею. «Я был вынужден стать оригинальным».",environment:"Уединённость двора Эстерхази защитила его от моды; затем импресарио Заломон привёз его в коммерческие концертные залы Лондона в 1791 году.",need:"Платящая лондонская публика хотела больших, остроумных, неожиданных симфоний. Он написал для неё двенадцать, включая «Сюрприз».",kairos:"Умение, созревшее в уединении, встретило рынок, который только что научился покупать билеты."}]},romantic:{name:"Романтические виртуозы",short:"Романтизм",tagline:"Гений как герой, концерт как стихия.",need:"После Наполеона Европа хотела героической личности: чувство выше разума, борьба выше симметрии, нация выше двора. Ей нужны были художники — святые и бури.",environment:["Рояль с чугунной рамой (Эрар, Бродвуд): громче, быстрее, можно возить","Железные дороги и массовая пресса делают возможной гастролирующую звезду","Нотоиздание и домашнее пианино создают публику среднего класса","Изобретён сольный концерт: слово «recital» впервые применили к лондонским концертам Листа в 1840 году"],artists:[{name:"Людвиг ван Бетховен",place:"Вена",headline:"Он сделал темой саму борьбу, и наполеоновская эпоха узнала в ней себя.",skill:"Мотивная разработка невиданного масштаба; способность построить сорок минут из четырёх нот.",environment:"Венские издатели и три аристократа, которые в 1809 году назначили ему ренту за то, чтобы он остался, без обязанностей. Первый композитор, не служивший никому.",need:"Эпоха революций и войн хотела музыки о героизме и судьбе. «Героическая» (премьера 1805) и Пятая ответили.",kairos:"Глухота стала мифом, а миф был тем, что требовалось романтизму: художник, который страдает и побеждает."},{name:"Ференц Лист",place:"Берлин",headline:"Первая поп-звезда. Берлин, 1842: женщины дрались за его порванные струны.",skill:"Фортепианная техника, недосягаемая для современников, выстроенная по примеру Паганини и на эраровском рояле, который её выдерживал.",environment:"Чугунная рама, железнодорожные гастроли, литографические портреты в продаже на концертах, сольный концерт в профиль, чтобы публика видела лицо.",need:"Романтическая публика хотела светского святого, телесного и опасного. Генрих Гейне назвал истерию «листоманией» в 1844 году.",kairos:"Виртуозность, новый инструмент, новая транспортная сеть и культура, только что изобретшая знаменитость, — в одном десятилетии."}]},ragtime:{name:"Рэгтайм и фонограф",short:"Рэгтайм",tagline:"Синкопа для нового века — продаётся нотными листами и цилиндрами.",need:"Современная, городская, быстрая Америка
