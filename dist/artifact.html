<title>Kairos Engine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Kairos Engine
   Layout: a full-bleed WebGL stage. A glass instrument cluster sits top-left, a dossier panel docks on the right,
   and a console (timeline + throttle) runs along the bottom. Single dark theme by design: this is a cockpit at night. */
:root {
  color-scheme: dark;
  --bg: #060912;
  --ink: #e9edf6;
  --ink-2: #9aa5bd;
  --ink-3: #5c667d;
  --glass: rgba(9, 14, 28, 0.66);
  --glass-2: rgba(14, 20, 38, 0.82);
  --line: rgba(233, 237, 246, 0.12);
  --chronos: #7fd6ff;      /* instrument readouts: ice */
  --kairos: #f2b84b;       /* the opportune moment: gold */
  --skill: #7b7ce6;  --env: #2a9d7a;  --need: #bd8a1f;            /* chart marks, validated for CVD on this surface */
  --skill-b: #9d9bff; --env-b: #3fe0b4; --need-b: #f6c35a;        /* bright UI chips */
  --pos: #bd8a1f; --neg: #3d8ac4;                                   /* diverging pair for the pendulum */
  --good: #3fbf7f; --warn: #e0a53a; --bad: #e05a5a;
  --font-display: 'Unbounded', 'Arial Black', Impact, sans-serif;
  --font-ui: 'Golos Text', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-serif: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --radius: 6px;
  --speed: 0;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.5; overflow: hidden; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
ul { margin: 0; padding-left: 1.1em; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.serif { font-family: var(--font-serif); }
.display { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.03em; font-weight: 700; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--chronos); }
.eyebrow.forecast { color: var(--kairos); }
.fine { font-size: 12px; color: var(--ink-3); line-height: 1.45; }
.muted { color: var(--ink-3); }
.glass { background: var(--glass); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); border: 1px solid var(--line); }
:focus-visible { outline: 2px solid var(--chronos); outline-offset: 2px; }

#app { position: fixed; inset: 0; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#gl:active { cursor: grabbing; }
.nogl { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); padding: 12px 16px; background: var(--glass-2); border: 1px solid var(--line); border-radius: var(--radius); max-width: 420px; text-align: center; }

#hud { position: absolute; inset: 0; pointer-events: none; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: max(12px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 400px); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "cluster tools" "flash dock" "console console"; gap: 12px; }
#hud > * { pointer-events: auto; }

/* Instrument cluster */
#cluster { grid-area: cluster; justify-self: start; align-self: start; padding: 10px 14px 10px; border-radius: var(--radius); min-width: 250px; }
.odo-row { display: flex; align-items: baseline; gap: 6px; }
.odo { display: flex; gap: 2px; height: 46px; overflow: hidden; }
.odo-col { width: 30px; height: 46px; overflow: hidden; background: rgba(0,0,0,0.35); border: 1px solid var(--line); border-radius: 4px; position: relative; }
.odo-col::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent 30%, transparent 70%, rgba(0,0,0,0.55)); pointer-events: none; }
.odo-strip { display: flex; flex-direction: column; will-change: transform; }
.odo-strip span { height: 46px; line-height: 46px; text-align: center; font-family: var(--font-mono); font-size: 32px; font-weight: 600; color: var(--ink); filter: blur(calc(var(--speed) * 1.2px)); }
.odo-frac { font-size: 18px; color: var(--chronos); width: 2ch; }
.odo-era { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.1em; }
.mode-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
.mode { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.18em; padding: 2px 8px; border-radius: 3px; border: 1px solid var(--line); color: var(--ink-2); }
.mode[data-mode="autopilot"] { color: var(--kairos); border-color: var(--kairos); }
.mode[data-mode="manual"], .mode[data-mode="braking"] { color: var(--chronos); border-color: var(--chronos); }
.mode[data-mode="docked"] { color: var(--good); border-color: var(--good); }
.dir { font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); }
.dir.fut { color: #9fd8ff; } .dir.past { color: #ff9f8a; }
.eta { font-size: 11px; color: var(--kairos); }
.readouts { display: grid; grid-template-columns: repeat(5, auto); gap: 4px 14px; margin: 10px 0 0; }
.readouts div { display: flex; flex-direction: column; }
.readouts dt { font-size: 10px; color: var(--ink-3); letter-spacing: 0.08em; text-transform: uppercase; }
.readouts dd { margin: 0; font-size: 14px; color: var(--chronos); }
.readouts dd small { font-size: 9px; margin-left: 3px; color: var(--ink-3); }

/* Toolbar */
#topRight { grid-area: tools; justify-self: end; align-self: start; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
select.lang { appearance: none; -webkit-appearance: none; padding-right: 22px; background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%); background-position: calc(100% - 12px) 55%, calc(100% - 8px) 55%; background-size: 4px 4px, 4px 4px; background-repeat: no-repeat; cursor: pointer; }
select.lang option { background: #0e1426; color: var(--ink); }
.intro-lang { display: flex; justify-content: flex-start; }
.btn { border: 1px solid var(--line); background: var(--glass-2); border-radius: var(--radius); padding: 8px 14px; cursor: pointer; transition: background .15s, border-color .15s, transform .1s; }
.btn:hover { border-color: var(--ink-2); }
.btn:active { transform: translateY(1px); }
.btn.small { padding: 6px 10px; font-size: 12px; }
.btn.ghost { background: transparent; }
.btn.primary { background: var(--kairos); color: #1a1206; border-color: var(--kairos); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn[aria-pressed="true"] { border-color: var(--chronos); color: var(--chronos); }

/* Dossier */
#dock { grid-area: dock; align-self: stretch; border-radius: var(--radius); display: flex; flex-direction: column; min-height: 0; max-height: 100%; transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .4s; overflow: hidden; }
#dock.hidden { transform: translateX(30px); opacity: 0; pointer-events: none; }
.dock-handle { display: none; }
.dock-body { overflow-y: auto; padding: 16px 18px 20px; display: flex; flex-direction: column; gap: 16px; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--ink-3) transparent; }
.dock-body h2.display { font-size: 17px; line-height: 1.2; margin-top: 2px; }
.dock-body .lede { color: var(--ink-2); font-size: 14px; }
.dock-body section { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.dock-body h3 { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.dock-body h3 .hint { font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--ink-3); font-size: 11px; }
.need { font-size: 19.5px; line-height: 1.35; color: var(--ink); font-style: italic; font-weight: 500; }
.env { color: var(--ink-2); font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.env li::marker { color: var(--env-b); }
.arch li::marker { color: var(--kairos); }
.cases { display: flex; flex-direction: column; gap: 8px; }
.case { text-align: left; width: 100%; border: 1px solid var(--line); background: rgba(255,255,255,0.025); border-radius: var(--radius); padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; transition: border-color .15s, background .15s; }
.case:hover { border-color: var(--ink-2); }
.case[aria-expanded="true"] { border-color: var(--kairos); background: rgba(242,184,75,0.07); }
.case-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.case-name { font-weight: 600; font-size: 14px; }
.case-year { color: var(--kairos); font-size: 12px; }
.case-head { color: var(--ink-2); font-size: 12.5px; line-height: 1.4; }
.fit { display: flex; flex-direction: column; gap: 3px; margin-top: 2px; }
.fit-row { display: grid; grid-template-columns: 82px 1fr 28px; gap: 8px; align-items: center; font-size: 10px; color: var(--ink-3); letter-spacing: 0.06em; text-transform: uppercase; }
.fit-track { height: 5px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
.fit-bar { display: block; height: 100%; border-radius: 3px; }
.fit-bar.skill { background: var(--skill-b); } .fit-bar.env { background: var(--env-b); } .fit-bar.need { background: var(--need-b); }
.fit-v { text-align: right; color: var(--ink-2); font-size: 11px; }
.chip { align-self: flex-start; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; border: 1px solid; }
.chip.locked { color: var(--kairos); border-color: var(--kairos); }
.chip.deferred { color: var(--ink-2); border-color: var(--ink-3); }
.chip.partial { color: var(--warn); border-color: var(--warn); }
.case-detail { padding: 4px 4px 10px; display: flex; flex-direction: column; gap: 10px; }
.case-detail dl { margin: 0; display: grid; grid-template-columns: 1fr; gap: 6px; }
.case-detail dt { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; }
.case-detail dd { margin: 0 0 4px; font-size: 13px; color: var(--ink-2); line-height: 1.45; }
.k-skill { color: var(--skill-b); } .k-env { color: var(--env-b); } .k-need { color: var(--need-b); }
.kairos { font-size: 19.5px; line-height: 1.3; font-style: italic; font-weight: 500; color: var(--kairos); border-left: 2px solid var(--kairos); padding-left: 10px; }
.note { font-size: 12.5px; color: var(--ink); background: rgba(127,214,255,0.08); border: 1px solid rgba(127,214,255,0.25); padding: 8px 10px; border-radius: 4px; }
.void-nav { display: flex; gap: 8px; flex-wrap: wrap; }
.void-nav .btn small { display: block; color: var(--ink-3); font-family: var(--font-mono); font-size: 10px; }
.conf { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: 11px; color: var(--ink-3); letter-spacing: 0.1em; text-transform: uppercase; }
.conf-track { height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
.conf-bar { display: block; height: 100%; background: var(--kairos); border-radius: 3px; }
.dirs { font-size: 12px; color: var(--ink-2); display: flex; flex-direction: column; gap: 3px; }
.dirs b { color: var(--ink); font-weight: 500; }
.axis-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip-btn { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 8px; border-radius: 3px; border: 1px solid var(--line); background: transparent; cursor: pointer; color: var(--ink-2); }
.chip-btn.on { color: var(--kairos); border-color: var(--kairos); }
#fchart { position: relative; }
.ftip { position: absolute; top: 6px; font-family: var(--font-mono); font-size: 11px; background: var(--glass-2); border: 1px solid var(--line); padding: 3px 6px; border-radius: 3px; pointer-events: none; white-space: nowrap; }
.fcap { font-size: 11.5px; color: var(--ink-3); line-height: 1.45; margin-top: 4px; }
svg.pendulum, svg.fchart { display: block; overflow: visible; }
.plabel { font-family: var(--font-mono); font-size: 9.5px; fill: var(--ink-3); letter-spacing: 0.04em; }
.plabel.on { fill: var(--ink-2); }
.prow:hover .plabel { fill: var(--ink); }

/* Flash */
.flash-wrap { grid-area: flash; align-self: center; justify-self: center; text-align: center; opacity: 0; pointer-events: none !important; transform: scale(0.96); }
.flash-wrap.show { animation: flash 1.6s ease-out forwards; }
@keyframes flash { 0% { opacity: 0; transform: scale(0.9); } 15% { opacity: 1; transform: scale(1); } 70% { opacity: 0.8; } 100% { opacity: 0; transform: scale(1.06); } }
.flash { font-size: clamp(20px, 4.2vw, 48px); color: var(--ink); text-shadow: 0 0 30px rgba(127,214,255,0.6); }
.flash-sub { font-size: 12px; color: var(--chronos); margin-top: 6px; letter-spacing: 0.1em; }
.toast { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); background: var(--glass-2); border: 1px solid var(--kairos); color: var(--ink); padding: 8px 14px; border-radius: var(--radius); font-size: 13px; max-width: min(92vw, 460px); text-align: center; opacity: 0; }
.toast.show { animation: toast 2.6s ease forwards; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 6px); } 10% { opacity: 1; transform: translate(-50%, 0); } 85% { opacity: 1; } 100% { opacity: 0; } }

/* Console */
#console { grid-area: console; border-radius: var(--radius); padding: 8px 14px 10px; display: flex; flex-direction: column; gap: 6px; }
.timeline { position: relative; padding-top: 14px; }
.tl-ticks { position: relative; height: 12px; }
.tl-tick { position: absolute; top: 0; transform: translateX(-50%); font-family: var(--font-mono); font-size: 9px; color: var(--ink-3); }
.tl-tick::after { content: ""; position: absolute; left: 50%; top: 13px; width: 1px; height: 5px; background: var(--ink-3); opacity: 0.6; }
.tl-tick.major::after { height: 8px; opacity: 1; }
.tl-track { position: relative; height: 50px; cursor: crosshair; border-top: 1px solid var(--line); margin-top: 8px; }
.tl-markers { position: absolute; inset: 0; }
.tl-mark { position: absolute; top: 2px; transform: translateX(-50%); background: none; border: 0; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--ink-2); }
.tl-mark .tl-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--chronos); box-shadow: 0 0 10px rgba(127,214,255,0.5); transition: transform .15s; }
.tl-mark.forecast .tl-dot { background: transparent; border: 1.5px solid var(--kairos); box-shadow: 0 0 10px rgba(242,184,75,0.4); }
.tl-mark .tl-name { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.06em; white-space: nowrap; opacity: 0.75; }
.tl-mark.row2 .tl-name { transform: translateY(11px); }
.tl-mark:hover .tl-dot, .tl-mark.here .tl-dot { transform: scale(1.5); }
.tl-mark.here { color: var(--ink); } .tl-mark.here .tl-dot { background: var(--kairos); box-shadow: 0 0 14px var(--kairos); }
.tl-mark.forecast.here .tl-dot { background: var(--kairos); }
.tl-now { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--ink-3); transform: translateX(-50%); pointer-events: none; }
.tl-now span { position: absolute; top: 22px; left: 4px; font-family: var(--font-mono); font-size: 9px; color: var(--ink-3); letter-spacing: 0.1em; }
.tl-needle { position: absolute; top: -8px; bottom: 0; width: 2px; background: var(--kairos); transform: translateX(-50%); box-shadow: 0 0 10px var(--kairos); pointer-events: none; }
.tl-needle::before { content: ""; position: absolute; top: -4px; left: 50%; transform: translateX(-50%); border: 5px solid transparent; border-top: 7px solid var(--kairos); }
.tl-label { position: absolute; top: -26px; transform: translateX(-50%); background: var(--glass-2); border: 1px solid var(--line); font-size: 11px; padding: 2px 6px; border-radius: 3px; pointer-events: none; color: var(--chronos); }
.controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.throttle { flex: 1 1 220px; min-width: 160px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; touch-action: none; cursor: ew-resize; user-select: none; }
.th-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.throttle.active .th-label.fut { color: #9fd8ff; } .throttle.active .th-label.past { color: #ff9f8a; }
.th-track { position: relative; height: 10px; border-radius: 5px; background: rgba(255,255,255,0.08); border: 1px solid var(--line); }
.th-track::before { content: ""; position: absolute; left: 50%; top: -4px; bottom: -4px; width: 1px; background: var(--ink-3); }
.th-fill { position: absolute; top: 1px; bottom: 1px; left: 50%; width: calc(abs(var(--u, 0)) * 50%); transform: translateX(calc(min(var(--u, 0), 0) * 100%)); background: linear-gradient(90deg, #ff9f8a, var(--chronos)); border-radius: 4px; opacity: 0.8; }
.th-knob { position: absolute; top: 50%; left: 50%; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); border: 2px solid var(--bg); box-shadow: 0 0 0 1px var(--line), 0 2px 8px rgba(0,0,0,0.5); transform: translate(-50%, -50%); transition: left .05s linear; }
body.moving .th-knob { box-shadow: 0 0 0 1px var(--line), 0 0 16px var(--chronos); }

/* Overlays */
.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(4, 6, 12, 0.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 20; transition: opacity .8s; }
.overlay[hidden] { display: none; }
.intro.gone { opacity: 0; pointer-events: none; }
.intro { background: radial-gradient(ellipse at 50% 40%, rgba(242,184,75,0.12), transparent 55%), rgba(4, 6, 12, 0.88); }
.intro-card { max-width: 560px; display: flex; flex-direction: column; gap: 16px; text-align: left; }
.intro-card h1 { font-size: clamp(24px, 5vw, 44px); line-height: 1.1; letter-spacing: 0.06em; background: linear-gradient(90deg, var(--ink), var(--kairos)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.intro-lede { font-size: 25px; line-height: 1.25; font-style: italic; font-weight: 500; color: var(--ink); }
.intro-body { color: var(--ink-2); font-size: 14.5px; max-width: 60ch; }
.intro-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.intro-keys { font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em; }
.modal-card { position: relative; width: min(760px, 100%); max-height: 100%; overflow: auto; border-radius: var(--radius); padding: 28px 30px 30px; scrollbar-width: thin; }
.modal-card.small { width: min(540px, 100%); }
.modal-body { display: flex; flex-direction: column; gap: 12px; }
.modal-body h2.display { font-size: 19px; }
.modal-body h3 { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); margin-top: 10px; }
.modal-body p { color: var(--ink-2); max-width: 68ch; }
.modal-body p b { color: var(--ink); }
.close { position: absolute; top: 10px; right: 12px; background: none; border: 0; font-size: 26px; line-height: 1; cursor: pointer; color: var(--ink-2); padding: 4px 8px; }
.close:hover { color: var(--ink); }
.table-wrap { overflow-x: auto; }
.matrix { border-collapse: collapse; width: 100%; font-size: 13px; }
.matrix th, .matrix td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.matrix th { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); }
.matrix td:nth-child(-n+3) { font-size: 12px; }
.keys { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; color: var(--ink-2); font-size: 13.5px; }
kbd { font-family: var(--font-mono); font-size: 11px; background: rgba(255,255,255,0.08); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; color: var(--ink); }

/* Phone and narrow layouts */
@media (max-width: 860px) {
  #hud { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto auto; grid-template-areas: "cluster" "tools" "flash" "dock" "console"; gap: 8px; padding-block: max(8px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-bottom, 0px)); }
  #topRight { justify-self: start; }
  .tl-tick:not(.century) { display: none; }
  .tl-mark.row2 .tl-name { transform: none; }
  #cluster { min-width: 0; padding: 8px 10px; }
  .odo-col { width: 24px; height: 36px; } .odo { height: 36px; } .odo-strip span { height: 36px; line-height: 36px; font-size: 24px; }
  .readouts { grid-template-columns: repeat(3, auto); gap: 2px 12px; }
  .readouts dd { font-size: 12px; }
  #dock { max-height: 44vh; transition: max-height .4s, transform .5s, opacity .4s; }
  #dock.collapsed { max-height: 34px; }

}

<script>
(()=>{var sa=[{key:"sincerity",neg:"Artifice",pos:"Sincerity",hint:"constructed spectacle ↔ raw truth"},{key:"communal",neg:"Individual",pos:"Communal",hint:"the solo voice ↔ the crowd"},{key:"body",neg:"Mind",pos:"Body",hint:"listening ↔ dancing"},{key:"local",neg:"Global",pos:"Local",hint:"world market ↔ scene-rooted"},{key:"rough",neg:"Polished",pos:"Rough",hint:"high production ↔ lo-fi"}],vn=1690,yn=2090,mt=2026,Ye=[{id:"baroque",name:"Baroque Courts",short:"Baroque",span:[1700,1750],center:1725,tagline:"Music as the architecture of faith and power.",need:"Order. A continent still rebuilding after a century of religious war wanted music that proved the universe was designed: counterpoint as proof of God, ceremony as proof of the king.",environment:["Patronage by church and court; a composer was staff, not a star","The organ and the harpsichord; well-tempered tuning spreading","Engraved scores printed in Amsterdam and London, slow but international","Venice and London inventing the paying public audience"],axes:{sincerity:-.4,communal:.6,body:-.3,local:.6,rough:-.7},artists:[{name:"George Frideric Handel",year:1742,place:"London and Dublin",status:"locked",headline:"The first composer to make the public, not the prince, his patron.",skill:"Italian opera craft learned in Rome and Venice, plus an instinct for spectacle and the singable chorus.",environment:"London was Europe's most commercial music city: subscription opera, then oratorio in theatres when opera went bankrupt.",need:"A rising Protestant middle class wanted grandeur in its own language, with a moral. Messiah (Dublin, 1742) gave them scripture as a blockbuster.",kairos:"When Italian opera collapsed, Handel pivoted to English oratorio at the exact moment a new audience could pay for it.",fit:{skill:.95,env:.9,need:.9}},{name:"Johann Sebastian Bach",year:1829,place:"Leipzig → Berlin",status:"deferred",headline:"Supreme skill, wrong decade. His Kairos arrived 79 years after his death.",skill:"The most complete contrapuntal technique in Western music, developed as a working church musician in Leipzig from 1723.",environment:"A Lutheran town council that wanted serviceable cantatas, little printing, no public concert circuit. By 1750 his style read as old-fashioned.",need:"In 1829 Felix Mendelssohn revived the St Matthew Passion in Berlin. Romantic Germany, hungry for a national genius-ancestor, suddenly needed exactly what Bach had always been.",kairos:"Skill and environment were present in 1725; the need was not. The need arrived in 1829, and the lock fired on a dead man.",fit:{skill:1,env:.5,need:.15},note:"Lesson: a Kairos lock is a conjunction. Two out of three gives you a respected local craftsman."},{name:"Antonio Vivaldi",year:1711,place:"Venice → Amsterdam",status:"locked",headline:"The concerto as a thrill ride, exported by the printing press.",skill:"Violin virtuosity and a formula for the fast-slow-fast concerto that anyone in Europe could copy.",environment:"The Ospedale della Pietà gave him an orchestra of trained orphan girls to write for weekly; Estienne Roger in Amsterdam printed L'estro armonico (1711) for all of Europe.",need:"Grand Tour tourists and northern courts wanted the sound of Venice: brilliant, fast, modern.",kairos:"A house orchestra to test on, a printer to distribute, and a continent that wanted Venice in a box.",fit:{skill:.9,env:.85,need:.8}}]},{id:"classical",name:"Classical Vienna",short:"Classical",span:[1760,1800],center:1785,tagline:"Enlightenment reason you could hum.",need:"Clarity and wit. After the Baroque's ornament, the Enlightenment wanted music that argued like a good essay: a theme, a conflict, a resolution anyone could follow. And a new bourgeois audience wanted to be in the room.",environment:["Vienna as an imperial capital full of aristocratic amateurs","The fortepiano replacing the harpsichord; dynamics become expression","Public subscription concerts and music publishers (Artaria) alongside court jobs","Joseph II's reforms briefly loosening censorship and patronage"],axes:{sincerity:-.1,communal:.2,body:-.6,local:.3,rough:-.8},artists:[{name:"Wolfgang Amadeus Mozart",year:1786,place:"Vienna",status:"locked",headline:"A freelance genius in the one city that briefly let a composer freelance.",skill:"A prodigy trained on a decade of European tours; melody, opera characterization, and speed.",environment:"Vienna after 1781: subscription concerts, piano students, publishers, Emperor Joseph II's open-minded court. Lorenzo Da Ponte for words.",need:"Enlightenment Vienna wanted social satire with a human face. The Marriage of Figaro (1786) let servants outwit a count during the decade before the French Revolution.",kairos:"His lock held while the environment held. His subscription series had already lapsed after 1786; when the 1788 Turkish war pulled the aristocracy's money away, his 1789 attempt to revive it drew a single subscriber.",fit:{skill:1,env:.8,need:.85},note:"Lesson: the lock can unlock. Environment is a variable, not a constant."},{name:"Joseph Haydn",year:1791,place:"Esterháza → London",status:"locked",headline:"Thirty years in an isolated court, then a London superstar at 58.",skill:'He built the vocabulary of the symphony and string quartet with a resident orchestra to test every idea. "I was forced to become original."',environment:"The Esterházy court's isolation protected him from fashion; then the impresario Salomon brought him to London's commercial concert halls in 1791.",need:`London's paying public wanted big, witty, surprising symphonies. He wrote twelve for them, including the "Surprise."`,kairos:"Skill matured in seclusion met a market that had just learned to buy tickets.",fit:{skill:.95,env:.85,need:.85}}]},{id:"romantic",name:"Romantic Virtuosos",short:"Romantic",span:[1800,1850],center:1830,tagline:"The genius as hero, the concert as weather.",need:"After Napoleon, Europe wanted the heroic individual: feeling over reason, struggle over symmetry, the nation over the court. It needed artists to be saints and storms.",environment:["The iron-framed grand piano (Érard, Broadwood): louder, faster, tourable","Railways and a mass press make the touring star possible","Music publishing and the home piano create a middle-class audience","The solo recital invented (the word first used for Liszt's London concerts, 1840)"],axes:{sincerity:.6,communal:-.7,body:-.5,local:0,rough:-.5},artists:[{name:"Ludwig van Beethoven",year:1805,place:"Vienna",status:"locked",headline:"He made struggle itself the subject, and the Napoleonic age recognized itself.",skill:"Motivic development on a scale no one had attempted; the ability to build forty minutes from four notes.",environment:"Vienna's publishers and three aristocrats who in 1809 paid him an annuity to stay, with no duties. The first composer employed by nobody.",need:"An era of revolution and war wanted music about heroism and fate. The Eroica (premiered 1805) and the Fifth answered.",kairos:"The deafness became the myth; the myth was what Romanticism needed: the artist who suffers and overcomes.",fit:{skill:1,env:.8,need:.95}},{name:"Franz Liszt",year:1842,place:"Berlin",status:"locked",headline:"The first pop star. Berlin, 1842: women fought over his broken strings.",skill:"A piano technique no contemporary could match, built on Paganini's example and an Érard that could survive it.",environment:"The iron-frame grand, the railway tour, lithograph portraits sold at concerts, the solo recital in profile so the audience could watch his face.",need:'A Romantic public wanted a secular saint, physical and dangerous. Heinrich Heine named the hysteria "Lisztomania" in 1844.',kairos:"Virtuosity, a new instrument, a new transport network, and a culture that had just invented celebrity, in one decade.",fit:{skill:1,env:.9,need:.9}}]},{id:"ragtime",name:"Ragtime & the Phonograph",short:"Ragtime",span:[1890,1915],center:1902,tagline:"Syncopation for a new century, sold by the sheet and by the cylinder.",need:"A modern, urban, fast America wanted a rhythm that sounded like itself. Syncopation, with its roots in Black musical practice, offered that, but a respectable parlor-piano version was what the mass market would buy.",environment:["Tin Pan Alley: the sheet-music industry industrializes the hit","Player pianos and piano rolls spread performances without performers","The 1893 Chicago World's Fair carries ragtime to a national audience","The phonograph goes from novelty to home appliance (Victor, 1901)"],axes:{sincerity:-.2,communal:.3,body:.6,local:-.2,rough:-.2},artists:[{name:"Scott Joplin",year:1899,place:"Sedalia, Missouri",status:"locked",headline:"Maple Leaf Rag: a classically trained composer and a publisher willing to pay royalties.",skill:"Formal training applied to a vernacular dance style; rags built with the discipline of sonatas.",environment:"The Maple Leaf Club in Sedalia, and John Stark, a small-town publisher who gave him a one-cent royalty per copy instead of a flat fee.",need:"America wanted Black syncopation in a form the parlor would accept: printed, playable, respectable.",kairos:"The need extended to rags and no further. His opera Treemonisha was never staged in his lifetime (first full production: 1972).",fit:{skill:.95,env:.75,need:.8},note:"Lesson: the lock is specific. A culture can need one part of you and refuse the rest."},{name:"Enrico Caruso",year:1904,place:"Milan → New York",status:"locked",headline:"The machine needed a voice to prove it was music. He was the voice.",skill:"A tenor with baritonal weight that cut through the acoustic recording horn where thinner voices vanished.",environment:`Victor's Red Seal label and the Metropolitan Opera; the phonograph needed prestige and he gave it. His 1907 "Vesti la giubba" is often cited as the first million-selling record.`,need:"A new mass medium needed a star to make buying a machine for the home seem cultured rather than odd.",kairos:"The technology needed him as much as he needed it. His voice happened to be shaped for a horn.",fit:{skill:.95,env:.95,need:.9}},{name:"Irving Berlin",year:1911,place:"New York",status:"locked",headline:`"Alexander's Ragtime Band": the hit as a manufactured product.`,skill:"Hooks. An immigrant song-plugger who could not read music and wrote in one key, with an uncanny ear for what a crowd would sing back.",environment:"Tin Pan Alley's plugging machine, vaudeville, and the dance craze. The song sold more than a million copies of sheet music.",need:"White mass audiences wanted ragtime's energy in a march they could follow.",kairos:"He was the right distance from the source: close enough to borrow the feel, far enough to package it.",fit:{skill:.8,env:.95,need:.9}}]},{id:"jazzage",name:"The Jazz Age",short:"Jazz Age",span:[1917,1929],center:1924,tagline:"Hot music for a culture that had just learned to speed.",need:"Release. After the war and the flu, under Prohibition, a young urban America wanted spontaneity, bodies in motion, and the soloist as an individual hero, in the same years it worshipped Lindbergh and Ruth. Black Americans arriving in northern cities wanted their own voice on record.",environment:["The Great Migration moves New Orleans to Chicago and Harlem",'Race records: after "Crazy Blues" (1920) sold, labels learn Black audiences buy',"Electrical recording (1925) finally captures brass and drums","Speakeasies, dance halls, radio networks (NBC, 1926)"],axes:{sincerity:.2,communal:.6,body:.8,local:.2,rough:.4},artists:[{name:"Louis Armstrong",year:1928,place:"New Orleans → Chicago",status:"locked",headline:"He turned the band into a stage for one voice, exactly when the culture wanted heroes.",skill:"Range, tone, and a rhythmic feel (swing) that reorganized how everyone after him placed a note. The Hot Five sessions, 1925 to 1928.",environment:"King Oliver's Chicago band, OKeh's race-records series, and electrical recording arriving just in time to capture a trumpet properly.",need:'A culture accelerating toward the individual wanted the improvising soloist, and "West End Blues" (1928) made that the center of the music.',kairos:"The microphone, the migration, and the age of the solo hero met a man who could invent a language on the spot.",fit:{skill:1,env:.9,need:.9}},{name:"Bessie Smith",year:1923,place:"Chattanooga → New York",status:"locked",headline:'"Downhearted Blues" sold about 780,000 copies in six months.',skill:"A voice built to fill tent shows without a microphone, and phrasing that made the blues feel like testimony.",environment:"Columbia's race-records division, created after Mamie Smith's 1920 hit proved the market existed.",need:"A migrating people wanted their own experience sung back to them, uncut.",kairos:"The market had been invented three years earlier; she was the first artist large enough to fill it.",fit:{skill:.95,env:.8,need:.9}},{name:"Duke Ellington",year:1927,place:"Washington → Harlem",status:"locked",headline:"The Cotton Club's radio wire made a Harlem bandleader a national name.",skill:"Composition for specific players; he wrote for the men, not the instruments.",environment:'A Harlem club with a weekly radio broadcast that went national by 1929, and a white clientele paying for sophisticated "jungle" exoticism.',need:"Harlem Renaissance ambition and downtown curiosity wanted a Black composer who sounded like modern art.",kairos:"A residency plus a transmitter: the first time a band's environment included the whole country.",fit:{skill:.95,env:.9,need:.8}}]},{id:"swing",name:"Swing & the Microphone",short:"Swing",span:[1930,1945],center:1938,tagline:"Depression escapism, wartime longing, and a voice in the living room.",need:"Collective relief. The Depression wanted dance floors full of people moving together; the war wanted intimacy at a distance, a voice that sounded like it was next to you.",environment:["The microphone: singing becomes conversation (crooning)","Network radio and the jukebox put bands in every town","Big bands tour by bus; the ballroom is the venue","A 1942 to 1944 recording strike by musicians favors vocalists"],axes:{sincerity:-.3,communal:.8,body:.5,local:-.3,rough:-.5},artists:[{name:"Benny Goodman",year:1935,place:"Palomar Ballroom, Los Angeles",status:"locked",headline:"August 21, 1935: swing broke because of a time zone.",skill:"Clarinet precision and the nerve to play Fletcher Henderson's hot Black arrangements with a white band on national radio.",environment:`NBC's "Let's Dance" aired Goodman's hour after midnight in New York, which was prime time in California. West Coast teenagers had been listening for months.`,need:"Depression youth wanted to dance hard. The cross-country tour was dying; the Palomar crowd exploded because they already knew the records.",kairos:"Same band, same book, wrong city for weeks, then the right city. Environment was literally the clock.",fit:{skill:.9,env:.95,need:.9}},{name:"Bing Crosby",year:1931,place:"CBS Radio",status:"locked",headline:"The first voice designed for a microphone instead of a hall.",skill:"A relaxed baritone with jazz phrasing, intimate rather than projected.",environment:"The condenser and ribbon microphone, and a national CBS radio show from 1931. Later, the first to pre-record radio on tape.",need:"A frightened country wanted reassurance in the living room, not a tenor in a theatre.",kairos:"Before the microphone his skill was a limitation. After it, it was the template for every singer for forty years.",fit:{skill:.9,env:1,need:.9}},{name:"Frank Sinatra",year:1942,place:"Paramount Theatre, New York",status:"locked",headline:"The bobby-soxers screamed because the boys were overseas.",skill:"Breath control learned from Tommy Dorsey's trombone; he sang a line the way a lover talks.",environment:"The young men were at war, so teenage girls became the audience; the 1942 musicians' recording ban meant labels needed solo singers.",need:"Wartime longing wanted a vulnerable boy-next-door who seemed to sing to each girl alone.",kairos:"The absence of a generation of men created a market, and the strike removed the bands that would have hidden him.",fit:{skill:.95,env:.9,need:1}}]},{id:"rocknroll",name:"Rock 'n' Roll",short:"Rock 'n' Roll",span:[1950,1959],center:1955,tagline:"Teenagers get money, radios, and a sound their parents hate.",need:`Identity. The first generation with the word "teenager" and disposable income wanted a culture that was not their parents', with the body in it. In a segregated country, white radio needed a way to play Black rhythm and blues.`,environment:["The 45 rpm single (1949) and the transistor radio (1954)","Independent labels: Sun, Chess, Specialty, Atlantic","Television and DJs like Alan Freed as national gatekeepers","Cars, drive-ins, and postwar prosperity trickling down to teenagers"],axes:{sincerity:.5,communal:.1,body:.9,local:.4,rough:.7},artists:[{name:"Elvis Presley",year:1956,place:"Memphis → television",status:"locked",headline:"A segregated industry needed a white body for a Black sound. He was also brilliant.",skill:"A voice spanning gospel, country, and R&B, and a physical performance that did on screen what the music did in the room.",environment:"Sam Phillips at Sun Records (1954), RCA's national machine (1955), and the Ed Sullivan Show (September 1956, roughly sixty million viewers).",need:"Teenagers wanted a body on television that moved the way the records felt. White radio and TV would only carry that body if it was white.",kairos:"Part of his lock was built by injustice: the environment demanded a crossover conduit. The skill was real; the slot was manufactured.",fit:{skill:.9,env:1,need:1},note:"Lesson: the environment term includes who the system is willing to let through."},{name:"Chuck Berry",year:1955,place:"St. Louis → Chess Records, Chicago",status:"locked",headline:'"Maybellene": the first songwriter to write the teenage life as literature.',skill:"Guitar riffs that became the language of rock, and lyrics about cars, school, and boredom.",environment:"Chess Records, and Alan Freed, who took a co-writing credit in exchange for airplay.",need:"A new audience wanted its own narrator: not love songs, but their Tuesday.",kairos:"He described the need's world from the inside, in its own vocabulary, with a beat the radio could carry.",fit:{skill:.95,env:.75,need:.95}},{name:"Little Richard",year:1955,place:"J&M Studio, New Orleans",status:"partial",headline:`"Tutti Frutti": the pure energy. Pat Boone's cover outsold it on the pop chart.`,skill:"Volume, abandon, a piano that sounded like a riot.",environment:"Cosimo Matassa's studio and Specialty Records. Segregated radio meant a sanitized white cover charted higher.",need:"Ecstatic release, which the culture wanted but would first accept through a filter.",kairos:"The need was present at full strength; the environment delivered half of it to him and half to a cover artist.",fit:{skill:1,env:.55,need:.95}}]},{id:"sixties",name:"The Sixties",short:"Sixties",span:[1963,1969],center:1966,tagline:"The largest teenage cohort in history, all turning on the radio at once.",need:"Joy, then meaning, then transcendence. America eleven weeks after the Kennedy assassination needed to feel good. A civil-rights decade needed anthems. A war needed dissent. A counterculture wanted doors of perception.",environment:["Multitrack studios: the LP becomes an artwork","Transatlantic television and the British Invasion","Motown's assembly-line model aimed at an integrated audience","FM radio, cheap electric guitars, festivals, the pill"],axes:{sincerity:.4,communal:.7,body:.2,local:-.5,rough:-.1},artists:[{name:"The Beatles",year:1964,place:"Liverpool → Hamburg → Ed Sullivan",status:"locked",headline:"February 9, 1964. 73 million viewers. A country in mourning wanted to smile.",skill:"Roughly 1,200 live performances by 1964, some 280 of them marathon nights in Hamburg. Two songwriters who competed, three-part harmony.",environment:"Liverpool was a port where sailors brought American records. Brian Epstein, George Martin at EMI, and Capitol finally promoting them in the US in December 1963.",need:"The biggest cohort of 13-to-17-year-olds ever was ready; the nation was eleven weeks past Dallas; the radio needed joy.",kairos:"Skill from Hamburg, an environment that had just opened a transatlantic TV channel, and a precise national mood. Any of the three missing and it is a good Liverpool band.",fit:{skill:.95,env:.95,need:1}},{name:"The Supremes / Motown",year:1964,place:"Detroit",status:"locked",headline:"Five straight number ones, the run starting the summer the Civil Rights Act was signed.",skill:"Holland-Dozier-Holland songwriting and the Funk Brothers, a house band that played on more hits than anyone.",environment:"Berry Gordy, who had worked a Lincoln-Mercury assembly line, built one for records: quality control, artist development, charm school.",need:'A country legislating integration wanted an integrated pop mainstream. "The Sound of Young America" was the brand.',kairos:"A factory model met a decade that needed the product the factory happened to make.",fit:{skill:.9,env:1,need:.95}},{name:"Bob Dylan",year:1963,place:"Greenwich Village",status:"locked",headline:"A generation wanted songs that meant something. He wrote them faster than anyone.",skill:"Lyrics as literature; he imported Rimbaud and Woody Guthrie into three chords.",environment:`The Village folk revival, John Hammond at Columbia, and a civil-rights movement that needed anthems ("Blowin' in the Wind" via Peter, Paul and Mary, 1963).`,need:"The movement needed songs; the college audience needed a conscience with a guitar.",kairos:"He then broke his own lock on purpose at Newport (1965), plugging in, and found a second need waiting.",fit:{skill:1,env:.85,need:.95}},{name:"Jimi Hendrix",year:1967,place:"Seattle → London → Monterey",status:"locked",headline:"The United States had no slot for a Black rock guitarist. London did.",skill:"He reinvented what an electric guitar was for: feedback, the whammy bar, the amplifier as instrument.",environment:"Chas Chandler took him to London in September 1966, where Marshall stacks, Clapton's scene, and the British press made him a star before America had heard him.",need:"The psychedelic moment wanted volume and transcendence, and the Vietnam years wanted a guitar that sounded like war.",kairos:"He changed countries to find the environment. Monterey (June 1967) imported him back as a finished star.",fit:{skill:1,env:.8,need:.9},note:"Lesson: if the environment is missing, sometimes you can move."}]},{id:"seventies",name:"The Seventies",short:"Seventies",span:[1970,1979],center:1975,tagline:"The sixties collapse, and the culture splits into bodies and rage.",need:'After Altamont and Nixon, there was no single need. Dance floors in gay, Black, and Latino clubs wanted liberation through the body. A bankrupt New York and a strike-bound Britain wanted someone to say "no future." The post-colonial world wanted a prophet.',environment:["The 12-inch single (1976) and the DJ as artist","The Moog and the sequencer; the synthesizer becomes a rhythm","Island Records markets reggae to rock audiences","Oil crisis economics, stadium tours, the cassette"],axes:{sincerity:.1,communal:.3,body:.7,local:.1,rough:.1},artists:[{name:"Bob Marley",year:1977,place:"Kingston → London",status:"locked",headline:"Exodus, written in exile after he was shot. The world wanted a prophet.",skill:"Melody with a message: he wrote hymns that worked as pop.",environment:"Chris Blackwell's Island Records remixed Catch a Fire (1973) with rock guitars for a white album market; London's Caribbean diaspora was the bridge.",need:"The post-colonial world and the Western left wanted an authentic voice of the oppressed who was also charismatic and beautiful.",kairos:"Jamaica's 1976 political violence gave him exile, exile gave him Exodus, and the West was waiting for exactly that record.",fit:{skill:.95,env:.85,need:.95}},{name:"Donna Summer & Giorgio Moroder",year:1977,place:"Munich",status:"locked",headline:'"I Feel Love": the first hit built almost entirely from a machine. Studio 54 opened the same spring.',skill:"A voice that could float over anything, and a producer who could program a Moog to pulse like a heartbeat.",environment:"Musicland Studios in Munich, the 12-inch single as a club format, and a New York nightlife at its peak.",need:"Gay liberation-era dance floors wanted a machine-body future, euphoric and endless. Brian Eno told David Bowie it was the sound of the next fifteen years.",kairos:"The sequencer was ready, the club format was ready, and the floor wanted to disappear into a pulse.",fit:{skill:.9,env:.95,need:.95}},{name:"Sex Pistols",year:1976,place:"London",status:"locked",headline:"December 1, 1976: two minutes of swearing on teatime television. Skill was not the skill required.",skill:"Not virtuosity. Johnny Rotten's sloganeering, Steve Jones's wall of guitar, and Malcolm McLaren and Vivienne Westwood's design and provocation.",environment:"Britain's IMF bailout year, youth unemployment, the SEX boutique, a weekly music press hungry for an enemy, and the Bill Grundy interview.",need:"A generation looking at no future needed someone to say it out loud, ugly.",kairos:"The need defined the skill. In 1972 the same band is unlistenable noise; in 1976 it is the truth.",fit:{skill:.6,env:.95,need:1},note:'Lesson: "skill" in the Kairos equation means the specific capability the need calls for, not a conservatory grade.'},{name:"Kraftwerk",year:1977,place:"Düsseldorf",status:"locked",headline:"A German future that was not American rock. Hip-hop would need it again in 1982.",skill:"Engineering as composition; they built their own instruments.",environment:"A post-war German identity vacuum and a Düsseldorf art scene with no interest in blues.",need:'Europe wanted a modern sound of its own; then the Bronx wanted a machine beat, and "Planet Rock" (1982) replayed inist pop wanted a woman who visibly ran her own show and made no apology.",kairos:"A medium that valued visual authorship appeared at the exact moment a performer whose authorship was visual walked in.",fit:{skill:.8,env:1,need:.95}},{name:"Run-DMC",year:1986,place:"Hollis, Queens",status:"locked",headline:'"Walk This Way" with Aerosmith and a million-dollar Adidas deal: rap enters the suburbs.',skill:"A hard, stripped delivery over drum machines, no disco band behind them.",environment:"Rick Rubin and Russell Simmons of Def Jam (their own records came out on Profile), MTV finally playing rap, and a Madison Square Garden show where the crowd held up their sneakers for an Adidas executive.",need:"Suburban America was ready for hip-hop if it came with a rock bridge. The Bronx had built the music a decade earlier.",kairos:"The culture's need was thirteen years behind the invention (Kool Herc, 1973). Run-DMC stood where the gap closed.",fit:{skill:.85,env:.95,need:.9}}]},{id:"nineties",name:"The Nineties",short:"Nineties",span:[1991,1999],center:1995,tagline:"Sincerity against gloss, until the gloss came back with a bang.",need:"Generation X wanted the opposite of the eighties: flannel over spandex, realness over image. Hip-hop became America's main storytelling form. Britain wanted collective ecstasy on a dance floor. And then a pre-teen market nobody had served wanted pop again.",environment:["SoundScan (1991) reveals what people actually buy: more rap and country than anyone admitted","The CD boom; recorded-music revenue peaks in 1999","The sampler (Akai MPC) and Pro Tools","MTV's Buzz Bin, TRL (1998), then Napster (June 1999)"],axes:{sincerity:.7,communal:.2,body:.3,local:.5,rough:.6},artists:[{name:"Nirvana",year:1992,place:"Aberdeen → Seattle → number one",status:"locked",headline:"January 1992: Nevermind knocks Michael Jackson off number one. The reluctance was the product.",skill:"Kurt Cobain's melodic instinct inside noise; quiet-loud dynamics borrowed from the Pixies.",environment:"Sub Pop and the Seattle scene, DGC's major-label money, Butch Vig's production, MTV, and SoundScan proving how many kids actually bought it.",need:"Suburban teenagers wanted a sincerity antidote to hair metal. A man who did not want to be a star became the star because that was the need.",kairos:"Skill, scene, and a swing of the sincerity pendulum, measured for the first time by an accurate chart.",fit:{skill:.9,env:.9,need:1}},{name:"Dr. Dre & Snoop Dogg",year:1992,place:"Compton → Death Row",status:"locked",headline:"The Chronic, eight months after the Los Angeles riots.",skill:"Production craft: Parliament-Funkadelic basslines rebuilt into G-funk; Snoop's lazy, exact flow.",environment:"Death Row and Interscope's distribution; SoundScan counting the suburbs; the LA uprising on every television.",need:"The mainstream was ready to hear Los Angeles tell its own story, and wanted it to sound like summer.",kairos:"A city's crisis on the news and a city's sound in the stores in the same year.",fit:{skill:.95,env:.9,need:.9}},{name:"Spice Girls",year:1996,place:"London",status:"locked",headline:'"Wannabe": Britpop had few girls in it, and nine-year-olds had money.',skill:'Five distinct personalities, a slogan ("Girl Power"), and a manager, Simon Fuller, who understood brands.',environment:"End-of-history pop optimism, global TV, and a market gap: Britpop and gangsta rap had both ignored pre-teen girls.",need:"A generation of girls wanted a gang of their own on the charts.",kairos:"The need was a hole in the market; the skill was being exactly the shape of the hole.",fit:{skill:.65,env:.9,need:.95}},{name:"Britney Spears",year:1998,place:"Louisiana → Stockholm → TRL",status:"locked",headline:'"...Baby One More Time" at the exact peak of the CD economy.',skill:"Mickey Mouse Club training: dance, camera presence, and a vocal tone Max Martin could build around.",environment:"Cheiron Studios in Stockholm, Jive Records, and TRL, launched the month before the single.",need:"The post-grunge sugar rebound: after a decade of sincerity, teenagers wanted the pendulum to swing back.",kairos:"Released at the all-time peak of CD revenue; a year later Napster arrived.",fit:{skill:.8,env:1,need:.95}}]},{id:"y2k",name:"The Download Decade",short:"2000s",span:[2e3,2009],center:2005,tagline:"The CD dies, the iPod wins, the label stops being the gate.",need:"After 9/11 and during Iraq, both escapism and anger. The file-sharing generation wanted music free and everywhere. Indie wanted the real again; the recession at the end wanted neon spectacle.",environment:["Napster to iTunes (2003) to the iPod: music becomes personal and portable","MySpace (2003) and YouTube (2005): fans become distribution","Pro Tools, Auto-Tune, ringtones, American Idol","CD revenue collapses; touring and 360 deals replace it"],axes:{sincerity:-.3,communal:-.6,body:.3,local:-.4,rough:-.4},artists:[{name:"Eminem",year:2e3,place:"Detroit",status:"locked",headline:"The Marshall Mathers LP sold 1.76 million copies in its first week.",skill:"Technical rhyme density few had matched, and a comedian's timing.",environment:"Dr. Dre's co-sign, the Detroit battle scene, TRL, and a culture war over lyrics that was free advertising.",need:"The white suburban kid who had bought rap for fifteen years finally had a mirror, and the country wanted someone to be angry at.",kairos:"Skill that could not be dismissed, a gatekeeper who vouched, and a moral panic that did the marketing.",fit:{skill:1,env:.9,need:.9}},{name:"Kanye West",year:2004,place:"Chicago → Roc-A-Fella",status:"locked",headline:"The College Dropout: a producer in a pink polo in a gangsta decade.",skill:"Sped-up soul samples as a signature, and the nerve to rap about middle-class doubt.",environment:"Roc-A-Fella as a producer first; a 2002 car crash that became the story of his debut.",need:"Hip-hop's audience wanted a persona that was not a gangster and not a joke.",kairos:"The field had one archetype too many and one too few. He filled the empty one.",fit:{skill:.9,env:.8,need:.9}},{name:"Arctic Monkeys",year:2006,place:"Sheffield → MySpace",status:"locked",headline:"The fastest-selling debut in British chart history at the time, built by fans ripping demo CDs to the internet.",skill:"Alex Turner's observational lyrics about taxi ranks and nights out, delivered at speed.",environment:"Demo CDs handed out at gigs, uploaded by fans to MySpace. The label arrived after the audience did.",need:"British youth wanted a chronicler of their own nights, and the internet wanted proof it could make a star without permission.",kairos:"The first band whose environment was built by its audience. The need was partly for the story itself.",fit:{skill:.9,env:.9,need:.9}},{name:"Lady Gaga",year:2009,place:"Lower East Side → Interscope",status:"locked",headline:'"Just Dance" hit number one in the US four months after Lehman Brothers collapsed.',skill:"A classically trained pianist and songwriter who treated pop as performance art.",environment:"Lower East Side clubs, Akon's imprint at Interscope, YouTube, and the rise of dance-pop production.",need:"Recession-era escapism wanted spectacle, and outsiders wanted a champion.",kairos:"Maximalism returned on schedule, and she had been rehearsing it for years in rooms of forty people.",fit:{skill:.9,env:.85,need:.95}}]},{id:"streaming",name:"The Streaming Decade",short:"2010s",span:[2010,2019],center:2015,tagline:"Earbuds, playlists, festivals, and fandoms with a plan.",need:"Intimacy through a phone and ecstasy at a festival drop, often from the same listener. A counter-wave wanted sincerity (Adele). The Black Lives Matter years wanted a poet. Gen Z wanted anxiety made audible. The world wanted pop that was not American.",environment:["Spotify (US launch 2011) and the playlist as the new radio","SoundCloud, YouTube, Instagram; the bedroom as a studio","Billboard counts streams (2013); volume beats sales","Atlanta's 808 trap production becomes pop's default; TikTok arrives (2018)"],axes:{sincerity:0,communal:-.3,body:.4,local:-.7,rough:-.1},artists:[{name:"Adele",year:2011,place:"London",status:"locked",headline:"21 sold about 31 million copies in a decade when nobody bought albums.",skill:"The voice, and plain songs about ordinary heartbreak with no costume.",environment:"XL Recordings, the Grammys, and a market saturated with Auto-Tune and EDM maximalism that she counter-programmed by doing none of it.",need:"The sincerity pendulum swung back exactly as she arrived. She was the only thing left that people would still pay for.",kairos:"The need was for the opposite of everything else on the chart, and she was the opposite.",fit:{skill:1,env:.8,need:1}},{name:"Drake",year:2015,place:"Toronto",status:"locked",headline:"The rapper who texts. Spotify's most-streamed artist in three of the four years from 2015 to 2018.",skill:"Melodic rap, emotional openness, meme fluency, and volume: he released more music than anyone could absorb.",environment:"Lil Wayne's Young Money, OVO, SoundCloud, and a streaming formula that rewarded catalog depth and playlist ubiquity.",need:"The smartphone era wanted a star who sounded like the inside of your phone at 2 a.m.",kairos:"The metric changed from sales to streams, and his particular skill set was the one that metric loved.",fit:{skill:.85,env:1,need:.9}},{name:"BTS",year:2018,place:"Seoul → Billboard",status:"locked",headline:"A small agency with no TV leverage went straight to Twitter. The fandom did the rest.",skill:"K-pop's training system: dance precision at a level Western pop had abandoned, plus lyrics the members wrote about youth and mental health.",environment:"Big Hit was too small for Korean broadcast politics, so it used YouTube, Twitter, and V Live directly. ARMY organized like a campaign.",need:"A global youth wanted sincere, collective-identity pop that was not from America. First US number one album: May 2018.",kairos:"Weakness (no media access) forced the strategy that the new environment rewarded most.",fit:{skill:.95,env:.9,need:.95}},{name:"Billie Eilish",year:2019,place:"A bedroom in Highland Park, Los Angeles",status:"locked",headline:"A whisper is the right instrument for an earbud.",skill:"Close, quiet vocal control, and Finneas's production, made in his bedroom.",environment:'"Ocean Eyes" on SoundCloud (2015), playlist placement, Interscope, and headphones as the default listening device.',need:"Gen Z wanted anti-pop: intimacy, anxiety, a friend who sounds like she is inside your head.",kairos:"The playback technology changed from speakers to earbuds, and the ideal voice changed with it.",fit:{skill:.9,env:.9,need:1}}]},{id:"algorithm",name:"The Algorithm Era",short:"2020s",span:[2020,2026],center:2023,tagline:"Lockdown, the feed, and the return of the mass ritual.",need:'Isolation, then its opposite. A lockdown generation wanted melodrama at full volume; the feed wanted fifteen seconds; then everyone wanted to be in a stadium together. The center of pop moved to Spanish, Korean, and Lagos. As machines began to sing, "a real person made this" became a feature.',environment:["TikTok as the discovery engine; sped-up and slowed remixes","Streaming devalues recordings; the tour becomes the product","AI-generated tracks appear (2023); provenance becomes a question","Fandoms as infrastructure; regional scenes going global at once"],axes:{sincerity:.5,communal:-.3,body:.2,local:-.1,rough:.3},artists:[{name:"Olivia Rodrigo",year:2021,place:"Disney → TikTok",status:"locked",headline:'"drivers license," January 2021: the biggest first heartbreak of the lockdown.',skill:"Songwriting precision in the Swift and Alanis lineage, at 17, with a bridge that detonates.",environment:"A Disney series audience, TikTok, and a locked-down generation with nothing to do but feel.",need:"Teenagers who had lost a year wanted melodrama they could scream in a parked car.",kairos:"Skill, a captive audience, and a moment of collective confinement, in the same week.",fit:{skill:.9,env:.95,need:1}},{name:"Bad Bunny",year:2022,place:"Puerto Rico",status:"locked",headline:"Un Verano Sin Ti: the most-streamed album on Earth, in Spanish, by a former grocery bagger from SoundCloud.",skill:"Genre fluidity, a persona that refuses to translate itself, and relentless output.",environment:"Streaming removed the language gate: a listener in Bogotá counts the same as one in Ohio. Puerto Rico's trap scene and SoundCloud (2016) got him started.",need:"A global-south generation wanted the center of pop to move, and refused to learn English to be heard.",kairos:"The counting system changed, and the thing it counted was already enormous.",fit:{skill:.9,env:1,need:.95}},{name:"Taylor Swift",year:2023,place:"The Eras Tour",status:"locked",headline:"The first billion-dollar tour, after seventeen years of building a world.",skill:"Songwriting and narrative world-building sustained across a career; she turned re-recording her catalog into a plot.",environment:"Streaming pushed the value of music from the recording to the live event; a Ticketmaster collapse made the demand itself the news.",need:"After the pandemic, a mass communal ritual, and women's fandom asserting itself as the biggest economic force in music.",kairos:"The need for togetherness peaked at the moment the market had moved all the value to the one place people had to be together.",fit:{skill:.95,env:.95,need:1}},{name:"Chappell Roan",year:2024,place:"Missouri → dropped → Lollapalooza",status:"locked",headline:"Dropped by her label in 2020. The largest daytime crowd in Lollapalooza history in 2024.",skill:"A belt, drag-camp theatricality, and songs that work as anthems in a field.",environment:"Dan Nigro as producer, TikTok, and an opening slot on Olivia Rodrigo's tour.",need:"Post-2020 queer joy as mainstream pop, and a culture tired of polish wanting a performer who looked like a real person in costume.",kairos:"The seven-year overnight success: the skill was ready in 2020, the need arrived in 2024, and she was still standing there.",fit:{skill:.9,env:.8,need:1},note:"Lesson: sometimes the only strategy is to still be there when the need arrives."}]},{id:"f1",name:"The Proof-of-Human Turn",short:"+1",span:[2027,2028],center:2027,forecast:!0,horizon:1,confidence:.7,tagline:"When anything can be generated, the only scarce thing is a witness.",need:'Trust and presence. After a year in which generated songs flooded every platform, listeners will pay a premium for proof that a human was there: one-take videos, rooms with an audience, mistakes left in. "Was a person there?" becomes the first question.',environment:["Generated music indistinguishable from human on first listen; platforms label provenance","Live tickets expensive at the top, so mid-size rooms and regional scenes carry discovery","Short-form fatigue; longer, slower formats regain attention","Regional scenes (South Asia, West Africa, Brazil, Southeast Asia) reach global charts without translation"],skills:["Live charisma and improvisation that cannot be faked","Humor, vulnerability, and visible flaws as a signature","Community craft: knowing your first thousand people by name","Documentation: the process as part of the work"],archetypes:["The documented amateur who improves in public","The regional star whose scene the algorithm finally counts","The band that records with no click track and says so"],axes:null,artists:[]},{id:"f5",name:"Participatory Worlds",short:"+5",span:[2031,2032],center:2031,forecast:!0,horizon:5,confidence:.45,tagline:"The album becomes a place you can change.",need:"Agency. After years of frictionless, personalized, passive listening, the culture swings toward touching the music: remixing, performing inside it, owning a part of it. The drop needs a crowd again, and the crowd wants to be in the song.",environment:["Stems released by default; remix rights normalized through micro-licensing","Spatial audio and lightweight AR glasses main
