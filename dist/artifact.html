sign: Regeln komponieren, nicht nur Songs","Interaktive Komposition und Gastgeberschaft: eine Menge von Mitschöpfern dirigieren","Lizenzkompetenz als kreative Fähigkeit","Eine Gegenfähigkeit: das langsame, fertige, analoge Album als Ritualobjekt"],archetypes:["Der Komponist-Architekt, der Welten statt Alben veröffentlicht","Der Gastgeber, dessen Liveset zum Teil vom Publikum gespielt wird","Das aufrichtige Nur-Vinyl-Projekt, das all das ablehnt und dafür geliebt wird"]},f10:{name:"Die Rückkehr der Hymne",short:"+10",tagline:"Nachdem alle ihre eigenen Hits hatten, wollen alle dasselbe Lied.",need:"Gemeinsame Lieder. Ein Jahrzehnt Hyperpersonalisierung hinterlässt eine Kultur, in der keine zwei Menschen dieselbe Musik kennen. Das Pendel schwingt zu Hymnen: Lieder für Stadien, Städte, Generationen und Trauer. Klimastress und alternde Gesellschaften wollen gemeinsam aufgeführten Trost.",environment:["Frühe neuronale und haptische Schnittstellen; Musik, die man im Körper spürt, ohne Lautsprecher","KI-Co-Autoren so unsichtbar wie Auto-Tune; es gibt ein „ohne Hilfe“-Zertifikat wie bei Biolebensmitteln","Dauerhafte virtuelle Spielstätten und physische Superfestivals; das synchrone Ereignis ist das knappe Gut","Die Generation Alpha als Erwachsene; eine neue Kohorte, groß genug, die Charts auf einmal zu bewegen"],skills:["Melodische Universalität: für zehntausend Stimmen auf einmal schreiben","Mehrsprachiges und kulturübergreifendes Schreiben","Ritualdesign: der Bogen eines Abends, nicht eines Dreiminutentracks","Ausdauer und Verlässlichkeit; der Hymnen-Act tourt ein Jahrzehnt"],archetypes:["Der globale Chor-Act, wahrscheinlich nicht auf Englisch","Der Trauerdirigent: Musik für kollektives Trauern und Klimajahrestage","Das maximalistische Spektakel in einem Maßstab, den die Achtziger wiedererkennen würden"]},f50:{name:"Musik als Medizin, Gedächtnis, Wetter",short:"+50",tagline:"Jenseits des Prognosehorizonts hört das Pendelmodell auf, nützlich zu sein. Hier trotzdem eine Vermutung.",need:"Sinn und Kontinuität. Leben umspannen ein Jahrhundert; Klimata haben sich verändert; Maschinen machen unbegrenzt Musik. Die Kultur braucht Musik, die Erinnerung bewahrt, Körper reguliert, Zeit markiert und beweist, dass ein Mensch einmal hier war. Der Durchbruch weicht der Pflege.",environment:["Direkte neuronale Schnittstellen; Musik, die Physiologie liest und formt","Adaptive Klanglandschaften, eingebaut in Gebäude, Städte und Wettersysteme","Das Urheberrecht hat sich in ein Gemeingut mit Zuschreibung aufgelöst; „von Menschen gemacht“ ist eine Handwerkskategorie wie Handschrift","Aufführungen über die Lichtlaufzeit hinweg: ein Konzert auf der Erde, Minuten später beantwortet aus dem Orbit oder vom Mars"],skills:["Empathiedesign und bioakustische Kompetenz","Langformkomposition: Stücke, die sich über Jahre entfalten","Verwalterschaft: ein Jahrhundert Archive in etwas verwandeln, das ein Mensch halten kann","Präsenz: ein lebender Mensch in einem Raum zu sein, was selten genug sein wird, um als Fähigkeit zu gelten"],archetypes:["Der Komponist-Arzt","Der Archivar-Interpret, der die Toten mit ihrer Zustimmung spielt","Der, der immer noch Dreiminutenlieder von Hand schreibt, aus demselben Grund, aus dem Menschen noch Brot backen"]}};var Qu={baroque:{name:"Les cours baroques",short:"Baroque",tagline:"La musique comme architecture de la foi et du pouvoir.",need:"L'ordre. Un continent encore en reconstruction après un siècle de guerres de religion voulait une musique prouvant que l'univers avait un dessein : le contrepoint comme preuve de Dieu, la cérémonie comme preuve du roi.",environment:["Mécénat de l'Église et de la cour ; un compositeur était un employé, pas une vedette","L'orgue et le clavecin ; le tempérament égal se répand","Partitions gravées imprimées à Amsterdam et à Londres, lentes mais internationales","Venise et Londres inventent le public payant"],artists:[{place:"Londres et Dublin",headline:"Le premier compositeur à faire du public, et non du prince, son mécène.",skill:"Le métier de l'opéra italien appris à Rome et à Venise, plus un instinct du spectacle et du chœur que l'on peut chanter.",environment:"Londres était la ville musicale la plus commerciale d'Europe : opéra par souscription, puis oratorio dans les théâtres quand l'opéra fit faillite.",need:"Une classe moyenne protestante montante voulait de la grandeur dans sa propre langue, avec une morale. Le Messie (Dublin, 1742) lui donna l'Écriture en format superproduction.",kairos:"Quand l'opéra italien s'effondra, Haendel pivota vers l'oratorio anglais au moment exact où un nouveau public pouvait le payer."},{place:"Leipzig → Berlin",headline:"Talent suprême, mauvaise décennie. Son Kairos arriva 79 ans après sa mort.",skill:"La technique contrapuntique la plus complète de la musique occidentale, développée comme musicien d'église à Leipzig à partir de 1723.",environment:"Un conseil municipal luthérien qui voulait des cantates utilisables, peu d'imprimerie, aucun circuit de concerts publics. Vers 1750, son style passait pour démodé.",need:"En 1829, Felix Mendelssohn ressuscita la Passion selon saint Matthieu à Berlin. L'Allemagne romantique, affamée d'un génie-ancêtre national, eut soudain besoin exactement de ce que Bach avait toujours été.",kairos:"Le talent et l'environnement étaient là en 1725 ; le besoin, non. Le besoin arriva en 1829, et le verrouillage se déclencha sur un mort.",note:"Leçon : un verrouillage du Kairos est une conjonction. Deux sur trois donnent un artisan local respecté."},{place:"Venise → Amsterdam",headline:"Le concerto comme manège à sensations, exporté par l'imprimerie.",skill:"Une virtuosité de violoniste et une formule de concerto vif-lent-vif que n'importe qui en Europe pouvait copier.",environment:"L'Ospedale della Pietà lui donnait un orchestre d'orphelines formées pour lequel il écrivait chaque semaine ; Estienne Roger, à Amsterdam, imprima L'estro armonico (1711) pour toute l'Europe.",need:"Les touristes du Grand Tour et les cours du Nord voulaient le son de Venise : brillant, rapide, moderne.",kairos:"Un orchestre maison pour essayer, un imprimeur pour diffuser, et un continent qui voulait Venise en boîte."}]},classical:{name:"La Vienne classique",short:"Classicisme",tagline:"La raison des Lumières, à fredonner.",need:"Clarté et esprit. Après l'ornement baroque, les Lumières voulaient une musique qui argumente comme un bon essai : un thème, un conflit, une résolution que chacun peut suivre. Et un nouveau public bourgeois voulait être dans la salle.",environment:["Vienne, capitale impériale pleine d'aristocrates amateurs","Le pianoforte remplace le clavecin ; la dynamique devient expression","Concerts publics par souscription et éditeurs de musique (Artaria) à côté des charges de cour","Les réformes de Joseph II desserrent brièvement censure et mécénat"],artists:[{place:"Vienne",headline:"Un génie indépendant dans la seule ville qui, brièvement, laissa un compositeur l'être.",skill:"Un prodige formé par une décennie de tournées européennes ; la mélodie, la caractérisation d'opéra et la vitesse.",environment:"Vienne après 1781 : concerts par souscription, élèves de piano, éditeurs, la cour ouverte de l'empereur Joseph II. Lorenzo Da Ponte pour les mots.",need:"La Vienne des Lumières voulait une satire sociale à visage humain. Les Noces de Figaro (1786) laissèrent des domestiques berner un comte, dans la décennie précédant la Révolution française.",kairos:"Son verrouillage tint tant que tint l'environnement. Sa série de souscription s'était déjà éteinte après 1786 ; quand la guerre turque de 1788 emporta l'argent de l'aristocratie, sa tentative de la relancer en 1789 ne trouva qu'un seul souscripteur.",note:"Leçon : le verrouillage peut se défaire. L'environnement est une variable, pas une constante."},{place:"Esterháza → Londres",headline:"Trente ans dans une cour isolée, puis superstar à Londres à 58 ans.",skill:"Il bâtit le vocabulaire de la symphonie et du quatuor à cordes avec un orchestre résident pour tester chaque idée. « J'ai été forcé de devenir original. »",environment:"L'isolement de la cour Esterházy le protégea de la mode ; puis l'imprésario Salomon l'amena dans les salles de concert commerciales de Londres en 1791.",need:"Le public payant de Londres voulait de grandes symphonies, spirituelles, surprenantes. Il en écrivit douze pour lui, dont « La Surprise ».",kairos:"Un talent mûri dans la réclusion rencontra un marché qui venait d'apprendre à acheter des billets."}]},romantic:{name:"Les virtuoses romantiques",short:"Romantisme",tagline:"Le génie comme héros, le concert comme tempête.",need:"Après Napoléon, l'Europe voulait l'individu héroïque : le sentiment plutôt que la raison, la lutte plutôt que la symétrie, la nation plutôt que la cour. Il lui fallait des artistes qui soient des saints et des orages.",environment:["Le piano à queue à cadre de fonte (Érard, Broadwood) : plus fort, plus rapide, transportable","Les chemins de fer et une presse de masse rendent possible la vedette en tournée","L'édition musicale et le piano domestique créent un public de classe moyenne","Le récital soliste est inventé : le mot fut employé pour la première fois pour les concerts londoniens de Liszt en 1840"],artists:[{place:"Vienne",headline:"Il fit de la lutte elle-même le sujet, et l'ère napoléonienne s'y reconnut.",skill:"Un développement motivique à une échelle que personne n'avait tentée ; la capacité de bâtir quarante minutes à partir de quatre notes.",environment:"Les éditeurs de Vienne et trois aristocrates qui, en 1809, lui versèrent une rente pour qu'il reste, sans obligations. Le premier compositeur employé par personne.",need:"Une ère de révolution et de guerre voulait une musique sur l'héroïsme et le destin. L'Héroïque (créée en 1805) et la Cinquième répondirent.",kairos:"La surdité devint le mythe ; le mythe était ce dont le romantisme avait besoin : l'artiste qui souffre et triomphe."},{place:"Berlin",headline:"La première pop star. Berlin, 1842 : des femmes se battaient pour ses cordes cassées.",skill:"Une technique pianistique qu'aucun contemporain n'égalait, bâtie sur l'exemple de Paganini et un Érard capable d'y survivre.",environment:"Le cadre de fonte, la tournée en chemin de fer, des portraits lithographiés vendus aux concerts, le récital soliste de profil pour que le public voie son visage.",need:"Un public romantique voulait un saint laïque, physique et dangereux. Heinrich Heine baptisa l'hystérie « lisztomanie » en 1844.",kairos:"La virtuosité, un instrument nouveau, un réseau de transport nouveau et une culture qui venait d'inventer la célébrité, en une seule décennie."}]},ragtime:{name:"Ragtime et phonographe",short:"Ragtime",tagline:"La syncope pour un siècle nouveau, vendue en partitions et en cylindres.",need:"Une Amérique moderne, urbaine, rapide voulait un rythme qui lui ressemble. La syncope, enracinée dans la pratique musicale noire, l'offrait, mais ce que le marché de masse achèterait, c'était une version respectable pour le piano de salon.",environment:["Tin Pan Alley : l'industrie de la partition industrialise le tube","Pianos mécaniques et rouleaux diffusent des interprétations sans interprètes","L'Exposition universelle de Chicago en 1893 porte le ragtime devant un public national","Le phonographe passe de la curiosité à l'appareil ménager (Victor, 1901)"],artists:[{place:"Sedalia, Missouri",headline:"Maple Leaf Rag : un compositeur de formation classique et un éditeur prêt à payer des droits.",skill:"Une formation savante appliquée à un style de danse populaire ; des rags construits avec la discipline des sonates.",environment:"Le Maple Leaf Club de Sedalia et John Stark, éditeur de petite ville qui lui accorda un cent de droits par exemplaire au lieu d'un forfait.",need:"L'Amérique voulait la syncope noire sous une forme que le salon accepterait : imprimée, jouable, respectable.",kairos:"Le besoin s'étendait aux rags et pas plus loin. Son opéra Treemonisha ne fut jamais monté de son vivant (première production complète : 1972).",note:"Leçon : le verrouillage est spécifique. Une culture peut avoir besoin d'une partie de vous et refuser le reste."},{place:"Milan → New York",headline:"La machine avait besoin d'une voix pour prouver qu'elle faisait de la musique. La voix, ce fut lui.",skill:"Un ténor au poids de baryton qui perçait le pavillon d'enregistrement acoustique là où les voix plus fines disparaissaient.",environment:"Le label Red Seal de Victor et le Metropolitan Opera ; le phonographe avait besoin de prestige et il le lui donna. Son « Vesti la giubba » de 1907 est souvent cité comme le premier disque vendu à un million d'exemplaires.",need:"Un nouveau média de masse avait besoin d'une vedette pour que l'achat d'une machine pour la maison paraisse cultivé plutôt qu'étrange.",kairos:"La technologie avait autant besoin de lui que lui d'elle. Sa voix se trouvait être faite pour un pavillon."},{place:"New York",headline:"« Alexander's Ragtime Band » : le tube comme produit manufacturé.",skill:"Des accroches. Un rabatteur de chansons immigré qui ne lisait pas la musique et n'écrivait que dans une tonalité, avec une oreille infaillible pour ce qu'une foule renverrait en chantant.",environment:"La machine de promotion de Tin Pan Alley, le vaudeville et la fièvre de la danse. La chanson se vendit à plus d'un million de partitions.",need:"Le public blanc de masse voulait l'énergie du ragtime dans une marche qu'il pouvait suivre.",kairos:"Il était à la bonne distance de la source : assez près pour emprunter la sensation, assez loin pour l'emballer."}]},jazzage:{name:"L'ère du jazz",short:"Ère du jazz",tagline:"De la musique brûlante pour une culture qui venait d'apprendre la vitesse.",need:"La décharge. Après la guerre et la grippe, sous la Prohibition, une jeune Amérique urbaine voulait de la spontanéité, des corps en mouvement et le soliste comme héros individuel, les années mêmes où elle adorait Lindbergh et Ruth. Les Noirs américains arrivant dans les villes du Nord voulaient leur propre voix sur disque.",environment:["La Grande Migration déplace La Nouvelle-Orléans vers Chicago et Harlem","Race records : après le succès de « Crazy Blues » (1920), les labels apprennent que le public noir achète","L'enregistrement électrique (1925) capte enfin les cuivres et la batterie","Bars clandestins, dancings, réseaux de radio (NBC, 1926)"],artists:[{place:"La Nouvelle-Orléans → Chicago",headline:"Il fit de l'orchestre une scène pour une seule voix, exactement quand la culture voulait des héros.",skill:"Une tessiture, un son et un sens du rythme (le swing) qui réorganisa la façon dont tous ceux qui suivirent placent une note. Les séances des Hot Five, 1925 à 1928.",environment:"L'orchestre de King Oliver à Chicago, la série de race records d'OKeh et l'enregistrement électrique, arrivé juste à temps pour capter correctement une trompette.",need:"Une culture qui accélérait vers l'individu voulait le soliste improvisateur, et « West End Blues » (1928) en fit le centre de la musique.",kairos:"Le micro, la migration et l'ère du héros solitaire rencontrèrent un homme capable d'inventer un langage sur-le-champ."},{place:"Chattanooga → New York",headline:"« Downhearted Blues » se vendit à environ 780 000 exemplaires en six mois.",skill:"Une voix faite pour remplir des chapiteaux sans micro, et un phrasé qui faisait du blues un témoignage.",environment:"La division race records de Columbia, créée après que le succès de Mamie Smith en 1920 eut prouvé que le marché existait.",need:"Un peuple en migration voulait entendre sa propre expérience, chantée sans coupure.",kairos:"Le marché avait été inventé trois ans plus tôt ; elle fut la première artiste assez grande pour le remplir."},{place:"Washington → Harlem",headline:"La ligne radio du Cotton Club fit d'un chef d'orchestre de Harlem un nom national.",skill:"Composer pour des interprètes précis ; il écrivait pour les hommes, pas pour les instruments.",environment:"Un club de Harlem avec une émission de radio hebdomadaire devenue nationale en 1929, et une clientèle blanche qui payait pour un exotisme « jungle » raffiné.",need:"L'ambition de la Renaissance de Harlem et la curiosité du centre-ville voulaient un compositeur noir qui sonne comme de l'art moderne.",kairos:"Une résidence plus un émetteur : la première fois que l'environnement d'un orchestre englobait le pays entier."}]},swing:{name:"Swing et micro",short:"Swing",tagline:"L'évasion de la Dépression, la nostalgie de la guerre et une voix dans le salon.",need:"Un soulagement collectif. La Dépression voulait des pistes pleines de gens qui bougent ensemble ; la guerre voulait de l'intimité à distance, une voix qui semble être à côté de vous.",environment:["Le micro : chanter devient converser (le crooning)","La radio en réseau et le juke-box amènent les orchestres dans chaque ville","Les big bands tournent en autocar ; le dancing est la salle","Une grève de l'enregistrement des musiciens (1942 à 1944) favorise les chanteurs"],artists:[{place:"Palomar Ballroom, Los Angeles",headline:"21 août 1935 : le swing explosa à cause d'un fuseau horaire.",skill:"Une précision de clarinettiste et le cran de jouer les arrangements brûlants du Noir Fletcher Henderson avec un orchestre blanc à la radio nationale.",environment:"Le « Let's Dance » de NBC diffusait l'heure de Goodman après minuit à New York, soit l'heure de grande écoute en Californie. Les adolescents de la côte Ouest écoutaient depuis des mois.",need:"La jeunesse de la Dépression voulait danser fort. La tournée à travers le pays se mourait ; la foule du Palomar explosa parce qu'elle connaissait déjà les disques.",kairos:"Le même orchestre, le même répertoire, la mauvaise ville pendant des semaines, puis la bonne. L'environnement, c'était littéralement l'horloge."},{place:"Radio CBS",headline:"La première voix conçue pour un micro et non pour une salle.",skill:"Un baryton détendu au phrasé jazz, intime plutôt que projeté.",environment:"Le micro à condensateur et à ruban, et une émission nationale sur CBS à partir de 1931. Plus tard, le premier à préenregistrer la radio sur bande.",need:"Un pays effrayé voulait du réconfort dans le salon, pas un ténor au théâtre.",kairos:"Avant le micro, son talent était une limite. Après, il devint le modèle de tous les chanteurs pendant quarante ans."},{place:"Paramount Theatre, New York",headline:"Les bobby-soxers hurlaient parce que les garçons étaient outre-mer.",skill:"Un contrôle du souffle appris du trombone de Tommy Dorsey ; il chantait une phrase comme parle un amant.",environment:"Les jeunes hommes étaient à la guerre, les adolescentes devinrent donc le public ; l'interdiction d'enregistrer de 1942 força les labels à chercher des chanteurs solistes.",need:"La nostalgie de guerre voulait un garçon vulnérable d'à côté qui semblait chanter pour chaque fille seule.",kairos:"L'absence d'une génération d'hommes créa un marché, et la grève écarta les orchestres qui l'auraient caché."}]},rocknroll:{name:"Rock 'n' roll",short:"Rock 'n' roll",tagline:"Les adolescents obtiennent de l'argent, des radios et un son que leurs parents détestent.",need:"L'identité. La première génération dotée du mot « adolescent » et d'argent de poche voulait une culture qui ne soit pas celle de ses parents, avec le corps dedans. Dans un pays ségrégué, la radio blanche avait besoin d'un moyen de passer du rhythm and blues noir.",environment:["Le 45 tours (1949) et la radio à transistors (1954)","Labels indépendants : Sun, Chess, Specialty, Atlantic","La télévision et des DJ comme Alan Freed en gardiens nationaux","Voitures, drive-in et la prospérité d'après-guerre qui finit par atteindre les adolescents"],artists:[{place:"Memphis → télévision",headline:"Une industrie ségréguée avait besoin d'un corps blanc pour un son noir. Il était en plus brillant.",skill:"Une voix couvrant gospel, country et R&B, et une performance physique qui faisait à l'écran ce que la musique faisait dans la salle.",environment:"Sam Phillips chez Sun Records (1954), la machine nationale de RCA (1955) et l'Ed Sullivan Show (septembre 1956, environ soixante millions de téléspectateurs).",need:"Les adolescents voulaient un corps à la télévision qui bouge comme sonnaient les disques. La radio et la télévision blanches ne laisseraient passer ce corps que s'il était blanc.",kairos:"Une partie de son verrouillage fut construite par l'injustice : l'environnement exigeait un passeur. Le talent était réel ; la place, fabriquée.",note:"Leçon : le terme environnement inclut qui le système accepte de laisser passer."},{place:"Saint-Louis → Chess Records, Chicago",headline:"« Maybellene » : le premier auteur à écrire la vie adolescente comme de la littérature.",skill:"Des riffs de guitare devenus la langue du rock, et des textes sur les voitures, l'école et l'ennui.",environment:"Chess Records, et Alan Freed, qui prit un crédit de coauteur en échange de diffusion.",need:"Un nouveau public voulait son propre narrateur : pas des chansons d'amour, mais son mardi.",kairos:"Il décrivit le monde du besoin de l'intérieur, dans son propre vocabulaire, avec un rythme que la radio pouvait porter."},{place:"Studio J&M, La Nouvelle-Orléans",headline:"« Tutti Frutti » : l'énergie pure. La reprise de Pat Boone la dépassa au classement pop.",skill:"Le volume, l'abandon, un piano qui sonnait comme une émeute.",environment:"Le studio de Cosimo Matassa et Specialty Records. La radio ségréguée fit qu'une reprise blanche aseptisée grimpa plus haut.",need:"Une décharge extatique, que la culture voulait mais n'accepta d'abord qu'à travers un filtre.",kairos:"Le besoin était là à pleine puissance ; l'environnement lui en livra la moitié, et l'autre moitié à un interprète de reprises."}]},sixties:{name:"Les sixties",short:"Sixties",tagline:"La plus grande cohorte d'adolescents de l'histoire allume la radio en même temps.",need:"La joie, puis le sens, puis la transcendance. Onze semaines après l'assassinat de Kennedy, l'Amérique avait besoin de se sentir bien. Une décennie de droits civiques avait besoin d'hymnes. Une guerre avait besoin de dissidence. Une contre-culture voulait des portes de la perception.",environment:["Studios multipistes : le 33 tours devient une œuvre d'art","Télévision transatlantique et British Invasion","Le modèle de chaîne de montage de la Motown, visant un public intégré","Radio FM, guitares électriques bon marché, festivals, la pilule"],artists:[{place:"Liverpool → Hambourg → Ed Sullivan",headline:"9 février 1964. 73 millions de téléspectateurs. Un pays en deuil voulait sourire.",skill:"Environ 1 200 concerts avant 1964, dont quelque 280 nuits marathon à Hambourg. Deux auteurs en compétition, des harmonies à trois voix.",environment:"Liverpool était un port où les marins rapportaient des disques américains. Brian Epstein, George Martin chez EMI et Capitol qui finit par les promouvoir aux États-Unis en décembre 1963.",need:"La plus grande cohorte de 13-17 ans de l'histoire était prête ; la nation en était à sa onzième semaine après Dallas ; la radio avait besoin de joie.",kairos:"Le talent de Hambourg, un environnement qui venait d'ouvrir une chaîne de télévision transatlantique et une humeur nationale précise. Qu'il en manque un, et c'est un bon groupe de Liverpool."},{place:"Détroit",headline:"Cinq numéros un d'affilée, la série commençant l'été où fut signé le Civil Rights Act.",skill:"Les chansons de Holland-Dozier-Holland et les Funk Brothers, un orchestre maison qui joua sur plus de tubes que quiconque.",environment:"Berry Gordy, qui avait travaillé sur une chaîne de montage Lincoln-Mercury, en construisit une pour les disques : contrôle qualité, développement des artistes, école de bonnes manières.",need:"Un pays qui légiférait l'intégration voulait une pop grand public intégrée. « The Sound of Young America » était la marque.",kairos:"Un modèle d'usine rencontra une décennie qui avait besoin du produit exact que fabriquait l'usine."},{place:"Greenwich Village",headline:"Une génération voulait des chansons qui veulent dire quelque chose. Il les écrivait plus vite que tout le monde.",skill:"Des textes comme de la littérature ; il importa Rimbaud et Woody Guthrie dans trois accords.",environment:"Le revival folk du Village, John Hammond chez Columbia et un mouvement des droits civiques qui avait besoin d'hymnes (« Blowin' in the Wind » par Peter, Paul and Mary, 1963).",need:"Le mouvement avait besoin de chansons ; le public étudiant avait besoin d'une conscience avec une guitare.",kairos:"Il brisa ensuite volontairement son propre verrouillage à Newport (1965), en se branchant, et trouva un second besoin qui l'attendait."},{place:"Seattle → Londres → Monterey",headline:"Les États-Unis n'avaient pas de place pour un guitariste de rock noir. Londres, si.",skill:"Il réinventa à quoi servait une guitare électrique : le larsen, le vibrato, l'ampli comme instrument.",environment:"Chas Chandler l'emmena à Londres en septembre 1966, où les murs de Marshall, la scène de Clapton et la presse britannique firent de lui une vedette avant que l'Amérique l'ait entendu.",need:"Le moment psychédélique voulait du volume et de la transcendance, et les années Vietnam voulaient une guitare qui sonne comme la guerre.",kairos:"Il changea de pays pour trouver l'environnement. Monterey (juin 1967) le réimporta en vedette accomplie.",note:"Leçon : si l'environnement manque, on peut parfois déménager."}]},seventies:{name:"Les seventies",short:"Seventies",tagline:"Les sixties s'effondrent, et la culture se scinde en corps et en rage.",need:"Après Altamont et Nixon, il n'y eut pas un besoin unique. Les pistes des clubs gays, noirs et latinos voulaient la libération par le corps. Un New York en faillite et une Grande-Bretagne en grève voulaient que quelqu'un dise « no future ». Le monde postcolonial voulait un prophète.",environment:["Le maxi 45 tours (1976) et le DJ comme artiste","Le Moog et le séquenceur ; le synthétiseur devient un rythme","Island Records vend le reggae au public rock","L'économie du choc pétrolier, les tournées de stades, la cassette"],artists:[{place:"Kingston → Londres",headline:"Exodus, écrit en exil après qu'on lui eut tiré dessus. Le monde voulait un prophète.",skill:"La mélodie avec un message : il écrivait des hymnes qui fonctionnaient comme de la pop.",environment:"L'Island Records de Chris Blackwell remixa Catch a Fire (1973) avec des guitares rock pour un marché blanc de l'album ; la diaspora caribéenne de Londres fut le pont.",need:"Le monde postcolonial et la gauche occidentale voulaient une voix authentique des opprimés qui soit aussi charismatique et belle.",kairos:"La violence politique de la Jamaïque en 1976 lui donna l'exil, l'exil lui donna Exodus, et l'Occident attendait exactement ce disque."},{place:"Munich",headline:"« I Feel Love » : le premier tube bâti presque entièrement par une machine. Le Studio 54 ouvrit le même printemps.",skill:"Une voix capable de flotter sur n'importe quoi et un producteur capable de programmer un Moog pour qu'il batte comme un cœur.",environment:"Les studios Musicland de Munich, le maxi 45 tours comme format de club et une vie nocturne new-yorkaise à son apogée.",need:"Les pistes de l'ère de la libération gay voulaient un futur machine-corps, euphorique et sans fin. Brian Eno dit à David Bowie que c'était le son des quinze années à venir.",kairos:"Le séquenceur était prêt, le format de club était prêt, et la piste voulait disparaître dans une pulsation."},{place:"Londres",headline:"1er décembre 1976 : deux minutes de jurons à la télévision de l'heure du thé. Le talent n'était pas le talent requis.",skill:"Pas la virtuosité. Les slogans de Johnny Rotten, le mur de guitare de Steve Jones, et le design et la provocation de Malcolm McLaren et Vivienne Westwood.",environment:"L'année du plan de sauvetage du FMI pour la Grande-Bretagne, le chômage des jeunes, la boutique SEX, une presse musicale hebdomadaire affamée d'un ennemi, et l'interview de Bill Grundy.",need:"Une génération face au « no future » avait besoin que quelqu'un le dise tout haut, et laid.",kairos:"Le besoin définit le talent. En 1972, le même groupe est un bruit inécoutable ; en 1976, c'est la vérité.",note:"Leçon : « talent », dans l'équation du Kairos, désigne la capacité précise que réclame le besoin, pas une note de conservatoire."},{place:"Düsseldorf",headline:"Un futur allemand qui n'était pas du rock américain. Le hip-hop en aurait de nouveau besoin en 1982.",skill:"L'ingénierie comme composition ; ils construisaient leurs propres instruments.",environment:"Un vide identitaire dans l'Allemagne d'après-guerre et une scène artistique de Düsseldorf sans aucun intérêt pour le blues.",need:"L'Europe voulait un son moderne à elle ; puis le Bronx voulut un beat de machine, et « Planet Rock » (1982) rejoua Trans-Europe Express au synthétiseur.",kairos:"Leur Kairos se déclencha deux fois, dans deux cultures, à cinq ans d'écart. La seconde fois, ils n'étaient même pas dans la pièce."}]},mtv:{name:"La décennie MTV",short:"MTV",tagline:"L'image devient son. Le Bronx devient le monde.",need:"Le spectacle et l'ambition dans les années Reagan et Thatcher ; un événement mondial fédérateur après la récession ; et, depuis les villes désindustrialisées, une voix pour la jeunesse noire que le grand public ne pouvait plus ignorer.",environment:["MTV démarre le 1er août 1981 ; un tube a désormais besoin d'un clip","Le CD (1982), le Walkman, la 808, la LinnDrum, le DX7","Marketing croisé avec Pepsi et Adidas ; Live Aid (1985)","Def Jam et le maxi 45 tours sortent le rap du Bronx"],artists:[{place:"Los Angeles → MTV",headline:"Thriller, « Billie Jean », le moonwalk à Motown 25 : trois verrouillages en six mois.",skill:"Une précision de danse et de voix entraînée depuis l'âge de cinq ans chez les Jackson 5 ; un perfectionnisme à la hauteur de celui de Quincy Jones.",environment:"Quincy Jones et les studios Westlake ; MTV, qui n'avait presque pas diffusé d'artistes noirs jusqu'à ce que CBS, dit-on, fasse pression pour « Billie Jean » (mars 1983) ; une émission spéciale vue par des dizaines de millions de personnes (mai 1983).",need:"Un monde post-disco et post-récession voulait un seul spectacle mondial que tous puissent partager.",kairos:"Il arriva avec le talent de toute une vie au moment où un nouveau média avait besoin d'un visage, et il offrit à ce média son premier crossover."},{place:"Downtown New York",headline:"Le talent, ce n'était pas la voix. C'était le contrôle de l'image, des producteurs et des affaires.",skill:"La danse, la culture visuelle, l'instinct d'A&R (elle choisit Nile Rodgers) et un travail acharné.",environment:"La Danceteria et la scène des clubs de downtown, Seymour Stein chez Sire et MTV, qui récompensait exactement ses forces.",need:"La pop postféministe voulait une femme qui dirige visiblement son propre spectacle et ne s'excuse pas.",kairos:"Un média qui valorisait l'auctorialité visuelle apparut au moment exact où entrait une interprète dont l'auctorialité était visuelle."},{place:"Hollis, Queens",headline:"« Walk This Way » avec Aerosmith et un contrat Adidas à un million : le rap entre dans les banlieues.",skill:"Une diction dure et dépouillée sur des boîtes à rythmes, sans orchestre disco derrière.",environment:"Rick Rubin et Russell Simmons de Def Jam (leurs propres disques sortaient chez Profile), MTV diffusant enfin du rap, et un concert au Madison Square Garden où la foule brandit ses baskets devant un dirigeant d'Adidas.",need:"L'Amérique des banlieues était prête pour le hip-hop s'il venait avec un pont rock. Le Bronx avait construit la musique une décennie plus tôt.",kairos:"Le besoin de la culture avait treize ans de retard sur l'invention (Kool Herc, 1973). Run-DMC se tenaient là où l'écart s'est refermé."}]},nineties:{name:"Les nineties",short:"Nineties",tagline:"La sincérité contre le brillant, jusqu'au retour fracassant du brillant.",need:"La génération X voulait le contraire des années 80 : la flanelle plutôt que le spandex, le vrai plutôt que l'image. Le hip-hop devint la principale forme narrative de l'Amérique. La Grande-Bretagne voulait l'extase collective sur une piste de danse. Puis un marché préadolescent que personne n'avait servi voulut de nouveau de la pop.",environment:["SoundScan (1991) révèle ce que les gens achètent vraiment : plus de rap et de country que quiconque ne l'admettait","Le boom du CD ; les revenus de la musique enregistrée culminent en 1999","L'échantillonneur (Akai MPC) et Pro Tools","Le Buzz Bin de MTV, TRL (1998), puis Napster (juin 1999)"],artists:[{place:"Aberdeen → Seattle → numéro un",headline:"Janvier 1992 : Nevermind déloge Michael Jackson de la première place. La réticence était le produit.",skill:"L'instinct mélodique de Kurt Cobain dans le bruit ; une dynamique calme-fort empruntée aux Pixies.",environment:"Sub Pop et la scène de Seattle, l'argent de la major DGC, la production de Butch Vig, MTV et SoundScan prouvant combien de gamins l'achetaient vraiment.",need:"Les adolescents des banlieues voulaient un antidote de sincérité au hair metal. Un homme qui ne voulait pas être une vedette devint la vedette parce que c'était là le besoin.",kairos:"Le talent, la scène et une oscillation du pendule de la sincérité, mesurée pour la première fois par un classement exact."},{place:"Compton → Death Row",headline:"The Chronic, huit mois après les émeutes de Los Angeles.",skill:"Le métier de producteur : des lignes de basse de Parliament-Funkadelic reconstruites en G-funk ; le flow nonchalant et précis de Snoop.",environment:"Death Row et la distribution d'Interscope ; SoundScan comptant les banlieues ; le soulèvement de Los Angeles sur toutes les télévisions.",need:"Le grand public était prêt à entendre Los Angeles raconter sa propre histoire, et voulait que ça sonne comme l'été.",kairos:"La crise d'une ville aux informations et le son d'une ville dans les magasins la même année."},{place:"Londres",headline:"« Wannabe » : la britpop comptait peu de filles, et les fillettes de neuf ans avaient de l'argent.",skill:"Cinq personnalités distinctes, un slogan (« Girl Power ») et un manager, Simon Fuller, qui comprenait les marques.",environment:"L'optimisme pop de la fin de l'histoire, la télévision mondiale et un trou dans le marché : la britpop et le gangsta rap avaient tous deux ignoré les préadolescentes.",need:"Une génération de filles voulait un gang à elle dans les classements.",kairos:"Le besoin était un trou dans le marché ; le talent, c'était d'avoir exactement la forme du trou."},{place:"Louisiane → Stockholm → TRL",headline:"« ...Baby One More Time » au sommet exact de l'économie du CD.",skill:"La formation du Mickey Mouse Club : la danse, la présence face caméra et un timbre autour duquel Max Martin pouvait construire.",environment:"Les studios Cheiron à Stockholm, Jive Records et TRL, lancé le mois précédant le single.",need:"Le rebond sucré post-grunge : après une décennie de sincérité, les adolescents voulaient que le pendule reparte.",kairos:"Sortie au sommet historique des revenus du CD ; un an plus tard, Napster arrivait."}]},y2k:{name:"La décennie du téléchargement",short:"Années 2000",tagline:"Le CD meurt, l'iPod gagne, le label cesse d'être la porte.",need:"Après le 11 septembre et pendant l'Irak, l'évasion et la colère à la fois. La génération du partage de fichiers voulait la musique gratuite et partout. L'indie voulait de nouveau le vrai ; la récession de la fin voulait un spectacle au néon.",environment:["De Napster à iTunes (2003) à l'iPod : la musique devient personnelle et portable","MySpace (2003) et YouTube (2005) : les fans deviennent la distribution","Pro Tools, Auto-Tune, sonneries, American Idol","Les revenus du CD s'effondrent ; la tournée et les contrats 360 les remplacent"],artists:[{place:"Détroit",headline:"The Marshall Mathers LP s'est vendu à 1,76 million d'exemplaires la première semaine.",skill:"Une densité technique de rimes que peu avaient égalée, et le timing d'un comique.",environment:"La caution de Dr. Dre, la scène des battles de Détroit, TRL et une guerre culturelle sur les paroles qui faisait de la publicité gratuite.",need:"Le gamin blanc de banlieue qui achetait du rap depuis quinze ans eut enfin un miroir, et le pays voulait quelqu'un contre qui se fâcher.",kairos:"Un talent impossible à balayer, un gardien qui s'est porté garant, et une panique morale qui a fait le marketing."},{place:"Chicago → Roc-A-Fella",headline:"The College Dropout : un producteur en polo rose dans une décennie gangsta.",skill:"Des samples de soul accélérés comme signature, et le culot de rapper le doute de la classe moyenne.",environment:"Roc-A-Fella d'abord comme producteur ; un accident de voiture en 2002 devenu l'histoire de son premier album.",need:"Le public du hip-hop voulait un personnage qui ne soit ni un gangster ni une blague.",kairos:"Le champ avait un archétype de trop et un de moins. Il remplit celui qui manquait."},{place:"Sheffield → MySpace",headline:"Le premier album le plus vite vendu de l'histoire des charts britanniques à l'époque, bâti par des fans qui mettaient les démos en ligne.",skill:"Les textes d'observation d'Alex Turner sur les stations de taxi et les soirées, débités à toute vitesse.",environment:"Des démos distribuées aux concerts et mises en ligne par les fans sur MySpace. Le label arriva après le public.",need:"La jeunesse britannique voulait un chroniqueur de ses propres nuits, et internet voulait la preuve qu'il pouvait fabriquer une vedette sans permission.",kairos:"Le premier groupe dont l'environnement fut construit par son public. Le besoin portait en partie sur l'histoire elle-même."},{place:"Lower East Side → Interscope",headline:"« Just Dance » atteignit la première place aux États-Unis quatre mois après la chute de Lehman Brothers.",skill:"Une pianiste de formation classique et auteure-compositrice qui traitait la pop comme de la performance.",environment:"Les clubs du Lower East Side, le label d'Akon chez Interscope, YouTube et la montée de la production dance-pop.",need:"L'évasion de la récession voulait du spectacle, et les marginaux voulaient une championne.",kairos:"Le maximalisme revint à l'heure prévue, et elle le répétait depuis des années dans des salles de quarante personnes."}]},streaming:{name:"La décennie du streaming",short:"Années 2010",tagline:"Écouteurs, playlists, festivals et fandoms avec un plan.",need:"L'intimité par le téléphone et l'extase au drop d'un festival, souvent chez le même auditeur. Un contre-courant voulait de la sincérité (Adele). Les années Black Lives Matter voulaient un poète. La génération Z voulait rendre l'anxiété audible. Le monde voulait une pop qui ne soit pas américaine.",environment:["Spotify (lancé aux États-Unis en 2011) et la playlist comme nouvelle radio","SoundCloud, YouTube, Instagram ; la chambre comme studio","Billboard compte les écoutes (2013) ; le volume bat les ventes","La production trap 808 d'Atlanta devient la norme de la pop ; TikTok arrive (2018)"],artists:[{place:"Londres",headline:"21 s'est vendu à environ 31 millions d'exemplaires dans une décennie où personne n'achetait d'albums.",skill:"La voix, et des chansons simples sur des chagrins ordinaires, sans costume.",environment:"XL Recordings, les Grammy et un marché saturé d'Auto-Tune et de maximalisme EDM, auquel elle fit contre-programmation en ne faisant rien de tout cela.",need:"Le pendule de la sincérité revint exactement à son arrivée. Elle était la seule chose pour laquelle les gens acceptaient encore de payer.",kairos:"Le besoin, c'était le contraire de tout le reste du classement, et elle était le contraire."},{place:"Toronto",headline:"Le rappeur qui envoie des textos. Artiste le plus écouté de Spotify trois années sur quatre de 2015 à 2018.",skill:"Un rap mélodique, une ouverture émotionnelle, une aisance avec les mèmes et le volume : il sortait plus de musique que quiconque ne pouvait en absorber.",environment:"Le Young Money de Lil Wayne, OVO, SoundCloud et une formule de streaming qui récompensait la profondeur de catalogue et l'omniprésence dans les playlists.",need:"L'ère du smartphone voulait une vedette qui sonne comme l'intérieur de votre téléphone à deux heures du matin.",kairos:"La métrique passa des ventes aux écoutes, et c'est précisément son ensemble de talents que cette métrique adorait."},{place:"Séoul → Billboard",headline:"Une petite agence sans poids à la télévision alla directement sur Twitter. Le fandom fit le reste.",skill:"Le système de formation de la K-pop : une précision de danse d'un niveau que la pop occidentale avait abandonné, plus des textes écrits par les membres eux-mêmes sur la jeunesse et la santé mentale.",environment:"Big Hit était trop petite pour la politique des chaînes coréennes, alors elle utilisa directement YouTube, Twitter et V Live. ARMY s'organisa comme une campagne.",need:"Une jeunesse mondiale voulait une pop sincère, à identité collective, qui ne vienne pas d'Amérique. Premier album numéro un aux États-Unis : mai 2018.",kairos:"La faiblesse (pas d'accès aux médias) força la stratégie que le nouvel environnement récompensait le plus."},{place:"Une chambre à Highland Park, Los Angeles",headline:"Un murmure est le bon instrument pour un écouteur.",skill:"Un contrôle vocal proche et calme, et la production de Finneas, faite dans sa chambre.",environment:"« Ocean Eyes » sur SoundCloud (2015), des placements en playlist, Interscope et le casque comme appareil d'écoute par défaut.",need:"La génération Z voulait de l'anti-pop : l'intimité, l'anxiété, une amie qui semble être dans votre tête.",kairos:"La technologie de lecture passa des enceintes aux écouteurs, et la voix idéale changea avec elle."}]},algorithm:{name:"L'ère de l'algorithme",short:"Années 2020",tagline:"Le confinement, le fil, et le retour du rituel de masse.",need:"L'isolement, puis son contraire. Une générati
